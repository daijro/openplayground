# Follow the browser's light/dark preference at startup (Dark (its darkest) in dark mode, Light otherwise), through
# the app's UI brightness preference, which it applies every frame. Set on the new Session the web app starts with,
# so an app restarted after a GPU loss keeps the user's choice.
- file: apps/*-web/src/**/*.rs
  find: '\bSession::new\(\)'
  replace: |-
    {
        let mut session = Session::new();
        let dark = web_sys::window().and_then(|w| w.match_media("(prefers-color-scheme: dark)").ok().flatten()).is_some_and(|m| m.matches());
        session.prefs.ui_brightness = if dark { "dark" } else { "light" }.into();
        session
    }
