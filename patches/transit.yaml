# transit in the browser, with its own studio UI. Upstream (github.com/transit-audio/transit) releases desktop packages
# only; its apps/soundcraft-web page runs SoundCraft's window (soundcraft_ui_egui::SoundApp), not the studio UI the
# desktop app runs (transit_ui_studio::StudioApp). These patches build that page with the studio instead, from the head
# commit.
#
# patches/transit/web.diff adds new files only:
#   apps/soundcraft-web/src/studio.rs   the page: StudioApp on the demo session (`?empty`: an empty one) with transit's
#                                  fonts, playing through cpal's Web Audio host (index.html already starts the audio at
#                                  the first click or key). File > Open… is Playground's Open dialog; "Open in transit"
#                                  and dropped files open sessions or import audio and MIDI at the cursor; a save (a
#                                  .transitz bundle) or a bounce goes to Playground's Save As, and the next save of that
#                                  name back there; the unsaved state goes to the page's leave warning.
#   crates/playback/src/player/web.rs   a page has no MIDI ports: the Player's MIDI read-backs the studio asks for each
#                                  frame (midi_status, midi_activity, the MIDI Monitor's taps) answer "nothing here".
#   crates/transit-playground/     wasm32-unknown-unknown has no clock (std's Instant::now and SystemTime::now
#                                  panic): `std` with web-time's clock. The modules that read the clock take `std` from
#                                  it on wasm through ONE `use` line at their end (a local `std` shadows the standard
#                                  library's name in that module; everything else in it still comes from the real std).
# Native builds see none of this: every rule adds or keeps wasm-only lines.
#
# Verify: node scripts/build.mjs check transit head (and LIVE=0), then the e2e (tests/live-apps/transit.mjs).
#
# Upstream removed its web app (and the wasm32 gates below) on 2026-10-28, in transit#177: tools.yaml pins the head channel to the
# last commit before it, 265cd59, and these rules apply to that commit only.

# Rules 1-2/30: the Player's MIDI on the web. The MIDI Monitor's ring types (monitor.rs, plain std) compile on wasm as
# they are, so its module loses its native-only gate (a no-op natively); midi_out's types and MidiStatus come from
# player/web.rs. If upstream gates more of the Player's MIDI API, give player/web.rs the stub.
- file: crates/playback/src/player/mod.rs
  find: '#\[cfg\(not\(target_arch\s*=\s*"wasm32"\)\)\]\s*\n(pub\s+mod\s+monitor;)'
  replace: '$1'
# MIDI Learn's mapping data (midi_map.rs, plain std/mix/model) compiles on wasm too: MapSpec is exported, the Player's
# Learn calls are stubbed in player/web.rs.
- file: crates/playback/src/player/mod.rs
  find: '#\[cfg\(not\(target_arch\s*=\s*"wasm32"\)\)\]\s*\n(pub\s+mod\s+midi_map;)'
  replace: '$1'
- file: crates/playback/src/player/mod.rs
  find: '#\[cfg\(not\(target_arch\s*=\s*"wasm32"\)\)\]\s*\n(pub\s+use\s+midi_map::\{[^}]*\bMapSpec\b[^}]*\};)'
  replace: '$1'
- file: crates/playback/src/lib.rs
  find: '(?:#\[cfg\(not\(target_arch\s*=\s*"wasm32"\)\)\]\s*\n)?(pub\s+use\s+player::(?:MapSpec;|\{[^}]*\bMapSpec\b[^}]*\};))'
  replace: '$1'
- file: crates/playback/src/player/mod.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: no MIDI ports (patches/transit.yaml).\n#[cfg(target_arch = \"wasm32\")] mod web;\n#[cfg(target_arch = \"wasm32\")] pub use web::{midi_out, Status as MidiStatus};\n"

# Rules 3-5/30: the page runs studio.rs instead of upstream's web.rs (which stays as it is, uncompiled), with the
# studio crate as a wasm dependency under a target spelling nobody else uses (`all(...)`). If upstream renames the
# page's `web` module or its `start`, follow.
- file: apps/soundcraft-web/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\ntransit-ui-studio = { workspace = true }\n"
- file: apps/soundcraft-web/src/main.rs
  find: '\bmod\s+web\s*;'
  replace: 'mod studio;'
- file: apps/soundcraft-web/src/main.rs
  find: '\bweb::start\(\)'
  replace: 'studio::start()'

# Rules 6-30/30: the clock (crates/transit-playground). The crates that read it depend on it under a target
# spelling nobody else uses; every non-test module that names Instant or SystemTime and runs in the page takes `std` from
# it (found with: grep -rln "Instant\|SystemTime" crates/{mix,plugin-host,playback,ui-studio}/src, tests, native-only
# modules and the studio's autosave aside). A crate root's line would reach its children through their `use super::*`
# (an ambiguous `std`), so plugin-host's root takes the two names it uses and mix's one call takes `std` in its own
# block. Upstream's own web page panics the same way at head (Player::new reads the clock since 5447076, issue #67).
# If upstream starts reading the clock in another module, give it the same line; a missing one panics ("time not
# implemented on this platform") at the first clock call.
- file: crates/mix/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\ntransit-playground = { path = \"../transit-playground\" }\n"
- file: crates/plugin-host/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\ntransit-playground = { path = \"../transit-playground\" }\n"
- file: crates/playback/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\ntransit-playground = { path = \"../transit-playground\" }\n"
- file: crates/ui-studio/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\ntransit-playground = { path = \"../transit-playground\" }\n"
- file: crates/mix/src/instance.rs
  find: 'let\s+started\s*=\s*std::time::Instant::now\(\);'
  replace: 'let started = { #[cfg(target_arch = "wasm32")] use transit_playground::std; std::time::Instant::now() };'
- file: crates/plugin-host/src/lib.rs
  find: '^use\s+std::time::\{Duration,\s*Instant\};'
  replace: "#[cfg(not(target_arch = \"wasm32\"))] use std::time::{Duration, Instant};\n#[cfg(target_arch = \"wasm32\")] use transit_playground::std::time::{Duration, Instant};"
- file: crates/plugin-host/src/phases.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/transit.yaml).\n#[cfg(target_arch = \"wasm32\")] use transit_playground::std;\n"
- file: crates/plugin-host/src/hosted.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/transit.yaml).\n#[cfg(target_arch = \"wasm32\")] use transit_playground::std;\n"
- file: crates/playback/src/devices.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/transit.yaml).\n#[cfg(target_arch = \"wasm32\")] use transit_playground::std;\n"
- file: crates/playback/src/player/handles.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/transit.yaml).\n#[cfg(target_arch = \"wasm32\")] use transit_playground::std;\n"
- file: crates/playback/src/player/runtime.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/transit.yaml).\n#[cfg(target_arch = \"wasm32\")] use transit_playground::std;\n"
- file: crates/playback/src/record.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/transit.yaml).\n#[cfg(target_arch = \"wasm32\")] use transit_playground::std;\n"
- file: crates/playback/src/player/device.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/transit.yaml).\n#[cfg(target_arch = \"wasm32\")] use transit_playground::std;\n"
- file: crates/playback/src/telemetry.rs
  find: '(?![\s\S])'
