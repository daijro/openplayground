# Live editing in Playground sessions (patches/transit/live.diff, on the playground-live crate: tools.yaml live_kit)
# What it's for: people in a Playground session work on the same session at once: tracks (adding, removing, grouping,
#   names, instruments, devices and their settings, mute, solo, volume, pan, sends), clips (adding, moving, trimming,
#   looping, fades, gain) and notes, tempo and meter reach the others as they are made; two people's edits to different
#   tracks or clips both stay; each person's Ctrl+Z takes back only their own edits; imported audio travels as the
#   session's media, so joining from a link needs no files; a connected session stays open (nothing replaces it). Each
#   sees the others' pointers with name tags over the arrangement, the piano roll and the mixer strips, with the value
#   they are setting (volume, pan, clip gain, velocity), the clip they are moving or trimming where it would land, their
#   selected clips and notes, and their playhead while playing. Personal, never shared: the transport and cursor, the
#   selection, zoom and scroll, and each track's height, lane view, folding, record arm and input monitor.
# How: crates/ui-studio/src/live.rs (the shared document, merge, adoption, media, presence and the drawing at the end of
#   each frame, from the layouts the studio keeps of its last frame) and apps/soundcraft-web/src/studio/live.rs (the
#   page's app offered to the session, each frame ending with live::frame). These rules only add the dependency, declare
#   the modules and call in, one line each.
# Verify: node scripts/build.mjs check transit head, the e2e and `cargo test -p transit-ui-studio --lib live::`.
# If upstream changes: when a line named below changes, anchor on its new spelling; if StudioApp or its state rename the
#   fields live.rs reads (arrange.layout, keys.layout, mixer.layout, the gestures, dialog, finish), follow them there.
#
# Rules 31-32: Session::alloc, the one id allocator: while connected, an id nobody else adding something at once picks.
- live: true
  file: crates/model/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nplayground-live = { path = \"../../playground-live\" }\n"
- live: true
  file: crates/model/src/session.rs
  find: 'pub\s+fn\s+alloc\s*\(\s*&mut\s+self\s*\)\s*->\s*u64\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if playground_live::connected() { return playground_live::fresh_id(&mut self.next_id); }"
# Rules 33-37: the studio's live module (wasm, and its native tests); StudioApp::run's first step (Undo and Redo go to
#   the session; every Undo goes through run: the Edit menu, Ctrl+Z, the Undo History); finish::refuses, which every
#   session-replacing command asks first (and the page's opened files): a connected session stays open; and the
#   arrangement's drag preview, for the clip being dragged where it would land.
- live: true
  file: crates/ui-studio/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(any(target_arch = \"wasm32\"))'.dependencies]\nplayground-live = { path = \"../../playground-live\", features = [\"egui\"] }\ntransit-audio-io = { workspace = true }\n\n[target.'cfg(not(target_arch = \"wasm32\"))'.dev-dependencies]\nplayground-live = { path = \"../../playground-live\", features = [\"egui\"] }\ntransit-audio-io = { workspace = true }\n"
- live: true
  file: crates/ui-studio/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only, and its native tests).\n#[cfg(any(target_arch = \"wasm32\", test))]\npub mod live;\n"
- live: true
  file: crates/ui-studio/src/lib.rs
  find: 'pub\s+fn\s+run\s*\(\s*&mut\s+self\s*,\s*id\s*:\s*&str\s*,\s*params\s*:\s*Value\s*\)\s*->\s*Result<Value,\s*String>\s*\{'
  after: "\n        #[cfg(any(target_arch = \"wasm32\", test))] if crate::live::undo(id) { return Ok(Value::Null); }"
- live: true
  file: crates/ui-studio/src/finish.rs
  find: 'pub\s+fn\s+refuses\s*\(\s*app\s*:\s*&mut\s+StudioApp\s*,\s*id\s*:\s*&str\s*\)\s*->\s*bool\s*\{'
  after: "\n    #[cfg(any(target_arch = \"wasm32\", test))] if crate::live::refuses_session_switch(app, id) { return true; }"
- live: true
  file: crates/ui-studio/src/arrange.rs
  find: 'let\s+preview\s*=\s*drag_preview\([^;]*\);'
  after: "\n    #[cfg(any(target_arch = \"wasm32\", test))] crate::live::dragging(preview);"
# Rules 38-40: the page: the crate for web::attach, studio/live.rs, and the app the runner starts wrapped by it.
- live: true
  file: apps/soundcraft-web/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(any(target_arch = \"wasm32\"))'.dependencies]\nplayground-live = { path = \"../../playground-live\" }\n"
- live: true
  file: apps/soundcraft-web/src/studio.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session.\nmod live;\n"
- live: true
  file: apps/soundcraft-web/src/studio.rs
  find: 'Box::new\(shell\)'
  replace: 'live::wrap(shell)'
