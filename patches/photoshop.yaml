# ══ Community plug-ins ══════════════════════════════════════════════════════════════════════════════════
# Rules 1–3 load the community filter plug-ins openplayground bundles with Photoshop. The site builds the
# store's plug-ins (github.com/akkk09/artcraft-store, .github/workflows/store.yml in
# github.com/daijro/openplayground) and scripts/fetch.mjs puts this app's into plugins/ next to its page:
#   plugins/index.json   [{id, name, version, author, description, kind, app, file}]
#   plugins/<file>       the .wasm module (PhotoCraft's sandboxed plug-in ABI)
# PhotoCraft's browser build can't load a plug-ins folder (plugin_cmds.rs: desktop only), so the web crate
# fetches them at startup and installs them into the process-wide registry; they then show up under
# Filter › Plug-ins like any installed plug-in. The browser console says what happened to each.
# Delete these rules if PhotoCraft gains its own way to load web plug-ins (a web plug-ins folder, a URL list
# in the preferences, …), and point fetch.mjs at whatever that reads.

# Rule 1/3: the web crate may use the plug-in registry.
# What it's for: rule 3 calls photocraft_plugins::registry::install_bytes. Nothing the web crate depends on
#   re-exports photocraft-plugins (the engine and ui-egui use it privately), and the engine's own
#   `plugin.install {data}` route would need serde_json and a base64 encoder, which the web crate lacks too.
# How: the workspace's own crate, already compiled into the app through the engine; Cargo adds one line to
#   Cargo.lock (photocraft-web's dependency list) on the first build, which doesn't pass --locked.
# Verify: `node scripts/build.mjs check photoshop release` (and head) compiles.
# If upstream changes: if the engine or ui-egui starts re-exporting photocraft_plugins (or the web crate
#   depends on it already), delete this rule and use that path in rule 3.
- file: apps/*-web/Cargo.toml
  find: '^\[dependencies\]$'
  after: "\nphotocraft-plugins = { workspace = true }"

# Rule 2/3: start loading the plug-ins at startup.
# What it's for: the plug-ins are in the Filter menu by the time the user gets to it.
# How: right after the logger is set up in web::start, so the log lines show; the fetch runs in the
#   background (rule 3), alongside the app's own start-up, and the registry is process-wide, so it doesn't
#   matter which finishes first: the menus list the registry each time they're built.
# Verify: the browser console shows "playground: installed plug-in …" lines; Filter › Plug-ins lists them.
# If upstream changes: anchor on whatever runs first in the web crate's start function.
- file: apps/*-web/src/web.rs
  find: 'eframe::WebLogger::init\([^;]*;'
  after: "\n    playground_plugins::load(); // playground (patches/photoshop.yaml): community plug-ins"

# Rule 3/3: fetch plugins/index.json and install the plug-ins it lists.
# What it's for: rules 1 and 2; this is the only code that talks to the page.
# How: window.fetch through js_sys::Reflect (like patches/word.yaml's bridge, so no new web-sys features),
#   relative to the page, so /photoshop/ and /head/photoshop/ each get their own channel's plugins/. Each
#   module goes to registry::install_bytes, which validates it (ABI version, manifest, limits) in the
#   wasmi sandbox; one console line per plug-in says it was installed, or why not. No index.json (a 404,
#   or an HTML fallback page that isn't JSON): nothing happens and nothing is logged.
# Verify: serve the build with a plugins/ folder (see scripts/fetch.mjs): the console logs
#   "playground: installed plug-in Smudge Blend 0.1.0 (photocraft_plugin_smudge_blend.wasm)" and the like,
#   Filter › Plug-ins lists them, and one runs on a pixel layer. Without plugins/ the console has no
#   "playground:" plug-in lines and the menu has only "Install Plug-in…".
# If upstream changes: this is self-contained; keep it at the end of the web crate's main file and follow
#   renames of registry::install_bytes / Plugin::manifest.
- file: apps/*-web/src/web.rs
  find: '$(?![\s\S])'
  before: |

    /// playground (patches/photoshop.yaml): the community plug-ins openplayground serves next to the page
    /// (plugins/index.json and the .wasm files it lists), installed into PhotoCraft's plug-in registry.
    mod playground_plugins {
        use js_sys::{Array, Function, Promise, Reflect, Uint8Array};
        use wasm_bindgen::{JsCast as _, JsValue};

        /// Installs every plug-in plugins/index.json lists, in the background, logging one line each. Without
        /// the index (a page not served by openplayground, or an app with no plug-ins) it does nothing.
        pub fn load() {
            wasm_bindgen_futures::spawn_local(async {
                let Ok(index) = get("plugins/index.json", "json").await else { return };
                if !Array::is_array(&index) {
                    log::warn!("playground: plugins/index.json isn't a list; no plug-ins installed");
                    return;
                }
                for entry in Array::from(&index).iter() {
                    let file = Reflect::get(&entry, &"file".into()).ok().and_then(|f| f.as_string()).unwrap_or_default();
                    let installed = match get(&format!("plugins/{file}"), "arrayBuffer").await {
                        Ok(buffer) => photocraft_plugins::registry::install_bytes(&Uint8Array::new(&buffer).to_vec()).map_err(|e| e.to_string()),
                        Err(e) => Err(format!("couldn't download it ({})", e.as_string().unwrap_or_else(|| format!("{e:?}")))),
                    };
                    match installed {
                        Ok(p) => log::info!("playground: installed plug-in {} {} ({file})", p.manifest().name, p.manifest().version),
                        Err(e) => log::warn!("playground: plug-in {file} not installed: {e}"),
                    }
                }
            });
        }

        /// `target[method](...args)`, awaited.
        async fn call(target: &JsValue, method: &str, args: &Array) -> Result<JsValue, JsValue> {
            let f: Function = Reflect::get(target, &method.into())?.dyn_into()?;
            let promise: Promise = f.apply(target, args)?.dyn_into()?;
            wasm_bindgen_futures::JsFuture::from(promise).await
        }

        /// GETs `url` (relative to the page) and reads the body with `read` ("json", "arrayBuffer"). A status
        /// other than 2xx is an error.
        async fn get(url: &str, read: &str) -> Result<JsValue, JsValue> {
            let response = call(&js_sys::global(), "fetch", &Array::of1(&url.into())).await?;
            if !Reflect::get(&response, &"ok".into())?.is_truthy() {
                let status = Reflect::get(&response, &"status".into())?;
                return Err(format!("HTTP {}", status.as_f64().unwrap_or_default()).into());
            }
            call(&response, read, &Array::new()).await
        }
    }

# Live editing in Playground sessions (patches/photoshop/live.diff + the playground-live crate, tools.yaml `live_kit`)
# What it's for: people in a Playground session edit the open documents together (each tab one document of the
#   session's set: one opened while connected reaches the others as a tab in the background, closing a tab is
#   personal; layers and settings merged per layer and field, pixels per 256×256 tile; typing on the canvas reaches the
#   others keystroke by keystroke) and see each other's pointer, selection and gestures under way (strokes, marquees
#   and lassos, Move drags, Free Transform) on the canvas in their color, with dots on the tabs saying who is where.
# How: the adapter lives in new files: apps/photocraft-web/src/live.rs (the binary checkpoint, merge, adoption, Undo,
#   presence), apps/photocraft-web/src/web/live_shell.rs (the kept runner and the shell that ends each frame with the
#   session's frame hook and draws the others), crates/engine/src/live.rs (Session::install_remote: a shared document
#   taken in with no history step), crates/format/src/store/live.rs (loads that reuse the tiles decoded before),
#   crates/ui-egui/src/live.rs (the Undo hook, and the gesture under way read from the app's own state) and
#   apps/photocraft-web/src/live/peers.rs (the others drawn on the canvas and the tabs). The playground-live crate
#   (patches/live/kit) gives the JSON merge and the presence look (pointers, name tags, colours, easing); its JSON
#   adapter isn't used, the checkpoint being binary. These rules only declare them and call in, each one line at the
#   end of a file or right after a function's signature, except the two in web.rs that keep the runner and wrap the
#   app. Native builds behave as before: the hooks compile on wasm, and in debug builds (the native tests) where
#   nothing connects.
# Verify: node scripts/build.mjs check photoshop head|release, then the e2e (tests/live-apps/photoshop.mjs) and
#   `cargo test -p photocraft-web live::`.
# If upstream changes: if a function named below is renamed, anchor on its new signature; if WebShell or its `app`
#   field is renamed, follow it in web/live_shell.rs; if the format's Loader changes, mirror store::load in
#   store/live.rs.
#
# The web crate's dependencies for the adapter (the .pcraft codec, serde_json, and the playground-live crate with its
# presence look, which also has serde_json read floats back exactly, so equal documents give equal bytes on every
# peer), on wasm and for its native tests, under target spellings nobody else uses.
- live: true
  file: apps/photocraft-web/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nphotocraft-format = { workspace = true }\nserde_json = { workspace = true }\nplayground-live = { path = \"../../playground-live\", features = [\"egui\"] }\n\n[target.'cfg(all(not(target_arch = \"wasm32\")))'.dev-dependencies]\nphotocraft-format = { workspace = true }\nplayground-live = { path = \"../../playground-live\", features = [\"egui\"] }\n"
# The adapter module (wasm, and the crate's native tests).
- live: true
  file: apps/photocraft-web/src/main.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only).\n#[cfg(any(target_arch = \"wasm32\", test))]\nmod live;\n"
# The web entry keeps its runner for the adapter and wraps its app (web/live_shell.rs, a child module so it reaches
# WebShell's fields).
- live: true
  file: apps/photocraft-web/src/web.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session.\nmod live_shell;\n"
- live: true
  file: apps/photocraft-web/src/web.rs
  find: 'eframe::WebRunner::new\(\)'
  replace: 'live_shell::runner()'
- live: true
  file: apps/photocraft-web/src/web.rs
  find: 'Ok\(Box::new\((?=\s*WebShell\b)'
  replace: 'Ok(live_shell::wrap('
# Session::install_remote (engine/src/live.rs, a child of the crate root so it reaches the open documents).
- live: true
  file: crates/engine/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web, and debug builds for the native tests).\n#[cfg(any(target_arch = \"wasm32\", debug_assertions))]\nmod live;\n"
# load_reusing (format/src/store/live.rs, a child of store so it reaches the loader's byte source), and its export.
- live: true
  file: crates/format/src/store.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web, and debug builds for the native tests).\n#[cfg(any(target_arch = \"wasm32\", debug_assertions))]\npub(crate) mod live;\n"
- live: true
  file: crates/format/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web, and debug builds for the native tests).\n#[cfg(any(target_arch = \"wasm32\", debug_assertions))]\npub use store::live::{Tiles, load_reusing};\n"
# The Undo hook (ui-egui/src/live.rs), asked first in PhotocraftApp::run, which every command goes through, and in
# menus::is_enabled, which enables Edit › Undo and its shortcut: while connected, Undo and Redo of the shared document
# go to the session (Free Transform and a crop box keep their own steps). Verify: the e2e's undo step reverts only the
# owner's stroke after the editor's arrived.
# The marquee under way as the canvas previews it (ui-egui/src/live.rs): upstream exports it from `canvas` for tests only.
- live: true
  file: crates/ui-egui/src/canvas.rs
  find: '(?![\s\S])'
  after: "\n#[cfg(not(test))]\npub(crate) use drag::marquee_preview_px;\n"
- live: true
  file: crates/ui-egui/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web, and debug builds for the native tests).\n#[cfg(any(target_arch = \"wasm32\", debug_assertions))]\npub mod live;\n"
- live: true
  file: crates/ui-egui/src/app/commands.rs
  find: 'pub\s+fn\s+run\s*\(\s*&mut\s+self\b[^{]*\{'
  after: "\n        #[cfg(any(target_arch = \"wasm32\", debug_assertions))] if crate::live::undo(self, id, true) { return Ok(serde_json::Value::Bool(true)); }"
- live: true
  file: crates/ui-egui/src/menus/state.rs
  find: 'pub\s+fn\s+is_enabled\s*\(\s*app\s*:[^{]*\{'
  after: "\n    #[cfg(any(target_arch = \"wasm32\", debug_assertions))] if crate::live::undo(app, id, false) { return true; }"
