# ProCraft in the browser. Upstream (github.com/artcraft-android/procraft) releases Android, Windows and Linux packages (no web
# build) and has no wasm32 code; these patches add the web build Playground serves, from its head commit. It replaces the
# earlier ProCraft (surfrpt1/procraft, retired and archived: its README names this one as the maintained app), a different and
# much smaller codebase, under the same slug.
#
# patches/procreate/web.diff adds new files only:
#   index.html, Trunk.toml      the web build at the repository's root (build.mjs builds there): trunk builds the `procraft`
#                               binary, the desktop app (desktop/, egui on winit and wgpu) for the page's canvas. index.html also
#                               keeps a pen's pressure, eraser end and lean (PointerEvents, which winit's web backend hands on as
#                               the mouse) and passes on files dropped on the page, which winit has no events for.
#   desktop/src/web.rs          the page's side: `main` on wasm asks the browser for the GPU, then starts the desktop's `main` on
#                               the canvas (winit's `spawn_app`). Open, Save, Save As, the exports, "Open in ProCraft" and drops are
#                               Playground's dialogs (`playgroundFiles`): the desktop's file dialogs can't wait for an answer, so the
#                               open ones ask Playground's Open and answer nothing now, and what it gives comes in as files dropped on
#                               the window (as a drop and Import do); a save dialog gives a path in memory at once, and what the app
#                               writes there goes to Playground's Save As after the frame (a painting saved to Files is kept up to
#                               date there by the next Save, as its Keep in browser storage says). The unsaved state is reported with
#                               `setUnsaved`: a painting changed since it was saved to Files or downloaded (the gallery the desktop
#                               keeps paintings in lasts only as long as the page).
#   crates/engine/src/playground.rs   what wasm32-unknown-unknown lacks: `std` with web-time's clock, an in-memory file system and a
#                               `HOME`, a temporary folder, threads that run their work where they are started (the page has one
#                               thread: those that would loop or wait for work don't start), a `PathBuf`'s exists, is_file and is_dir
#                               from those files (`PathExt`), and a `pollster` that polls once. The
#                               modules that use them take `std` from it on wasm through ONE `use` line at their end (a local `std`
#                               shadows the standard library's name in that module; everything else in it still comes from the real
#                               std).
#   crates/gpu/src/web.rs       the GPU on a page. The adapter and device can only be asked for without waiting, so the page's start
#                               asks and `Gpu::create` takes them; and pixels can't be mapped and waited for either, so every read of a
#                               texture (saves, exports, thumbnails, the eyedropper, selections, transforms) draws it onto a hidden
#                               canvas twice (its colour, and its alpha as grey) and reads that, which the browser answers by waiting
#                               for the GPU itself: the pixels come back as they are.
#   playground-rfd/, playground-arboard/   rfd's and arboard's calls as a page can answer them (see above; no system clipboard).
#
# WebGPU only: the brushes' smudge and footprint shaders read storage buffers, which WebGL2 has none of, so a browser without WebGPU
# says so on the page. Painting runs on the page's one thread (the engine's own `par` and the app's thread pools run where they are
# called). Measured in Chromium on an NVIDIA Lovelace GPU (a 2048 x 2048 canvas with 3 layers and a background, mouse moves every
# 8 ms across a few strokes): the display's 60 Hz holds (frames 16.7 ms at the median and the 95th percentile; across two runs the
# worst frame was 17 and 67 ms). On SwiftShader (a software GPU) it draws about 23 frames a second (33 ms at the median, 83 ms at
# the 95th percentile). The page's wasm is 27 MB (11.7 MB zipped).
# A pen's pressure, eraser end and lean reach the brushes (index.html); a mouse paints at full pressure.
# Off on the web: the time-lapse (a picture after each change, made into a video by the computer's ffmpeg; the Video tab shows nothing
# recorded), video and PDF import and animated MP4 export (ffmpeg, poppler), the system clipboard (paste a picture or files from
# outside the app; copy and paste inside it work), writing to or choosing a folder (layer PNG files, model textures), the second
# display (Project canvas), the computer's own fonts (text is drawn in Inter and egui's fonts), autosave to the gallery, and the
# crash-and-restart machinery (startup.rs). The gallery and settings live for the page: paintings are kept in Files (Save, Save As).
# Native builds see none of this: every rule adds wasm-only lines.

# The wasm-only dependencies. wgpu gets its WebGPU backend (and Send and Sync for its types, which the app's one
# plug-in thread needs; there is one thread), naga its WGSL front end (the plug-in filters); rfd and arboard (nothing of
# the desktop's use of them has a wasm32 version) stay as they are on native and are the page's stand-ins here.
- file: crates/engine/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(target_arch = \"wasm32\")'.dependencies]\nweb-time = \"1\"\n"
- file: crates/gpu/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(target_arch = \"wasm32\")'.dependencies]\nwgpu = { workspace = true, features = [\"webgpu\", \"fragile-send-sync-non-atomic-wasm\"] }\nnaga = { version = \"30\", default-features = false, features = [\"wgsl-in\"] }\nwasm-bindgen = \"0.2\"\njs-sys = \"0.3\"\nweb-sys = { version = \"0.3\", features = [\"Window\", \"Document\", \"Element\", \"HtmlCanvasElement\", \"CanvasRenderingContext2d\", \"ImageData\"] }\n"
- file: desktop/Cargo.toml
  find: '^egui-winit = "0.37"\n'
  replace: ''
- file: desktop/Cargo.toml
  find: '^arboard = .*\n'
  replace: ''
- file: desktop/Cargo.toml
  find: '^rfd = "0.17"\n'
  replace: ''
- file: desktop/Cargo.toml
  find: '(?![\s\S])'
  after: "\n# Playground's browser build (patches/procreate.yaml): the dependencies that have no wasm32 version, native only (the same\n# crates, so the native build's dependency graph is unchanged); and the page's, wasm only.\n[target.'cfg(not(target_arch = \"wasm32\"))'.dependencies]\negui-winit = \"0.37\"\nrfd = \"0.17\"\narboard = { version = \"3.6\", default-features = false, features = [\"image-data\"] }\n\n[target.'cfg(target_arch = \"wasm32\")'.dependencies]\negui-winit = { version = \"0.37\", default-features = false }\nplayground-rfd = { path = \"../playground-rfd\" }\nplayground-arboard = { path = \"../playground-arboard\" }\nchrono = { version = \"0.4\", default-features = false, features = [\"wasmbind\"] }\nwasm-bindgen = \"0.2\"\nwasm-bindgen-futures = \"0.4\"\njs-sys = \"0.3\"\nweb-sys = { version = \"0.3\", features = [\"Window\", \"Document\", \"Element\", \"HtmlCanvasElement\", \"HtmlElement\", \"CssStyleDeclaration\", \"console\"] }\n"

# The engine declares the std shim (see the top).
- file: crates/engine/src/lib.rs
  find: '^pub mod abr;\n'
  before: "// Playground's browser build: the clock, files and threads std lacks there (patches/procreate.yaml).\n#[cfg(target_arch = \"wasm32\")]\npub mod playground;\n"

# The GPU. `Gpu::create` blocks on `pollster::block_on` for the adapter and the device, which a page can't do: they
# come from the page's start (gpu/src/web.rs), the instance with them. And every read of a texture goes through
# `start_reading_part`, which waits for the GPU (`poll` and a channel): on the page web.rs answers it at once. The one read that
# maps a buffer of its own (each layer's alpha at a point) asks the same for each layer.
- file: crates/gpu/src/lib.rs
  find: '^mod sphere;\n'
  after: "#[cfg(target_arch = \"wasm32\")]\npub mod web;\n"
- file: crates/gpu/src/lib.rs
  find: '(    pub fn instance_after\(tries: usize\) -> Option<wgpu::Instance> \{\n)'
  replace: "$1        #[cfg(target_arch = \"wasm32\")]\n        {\n            return (tries == 0).then(web::instance);\n        }\n"
- file: crates/gpu/src/lib.rs
  find: '(    pub fn instance_for_display\([^)]*\) -> Option<wgpu::Instance> \{\n)'
  replace: "$1        #[cfg(target_arch = \"wasm32\")]\n        {\n            let _ = display;\n            return (tries == 0).then(web::instance);\n        }\n"
- file: crates/gpu/src/lib.rs
  find: '(        let adapter = pollster::block_on\(instance\.request_adapter\([\s\S]*?\.map_err\(\|e\| GpuError::NoAdapter\(e\.to_string\(\)\)\)\?;\n)'
  replace: "        #[cfg(target_arch = \"wasm32\")]\n        let adapter = web::adapter()?;\n        #[cfg(not(target_arch = \"wasm32\"))]\n$1"
- file: crates/gpu/src/lib.rs
  find: '(        let \(device, queue\) = pollster::block_on\(adapter\.request_device\([\s\S]*?\.map_err\(\|e\| GpuError::Device\(e\.to_string\(\)\)\)\?;\n)'
  replace: "        #[cfg(target_arch = \"wasm32\")]\n        let (device, queue) = web::device()?;\n        #[cfg(not(target_arch = \"wasm32\"))]\n$1"
- file: crates/gpu/src/canvas.rs
  find: '(fn start_reading_part\(gpu: &Gpu, texture: &wgpu::Texture, rect: IRect\) -> Readback \{\n)'
  replace: "$1    #[cfg(target_arch = \"wasm32\")]\n    {\n        return crate::web::read(gpu, texture, rect);\n    }\n"
- file: crates/gpu/src/canvas.rs
  find: '(        // one pixel of each layer, each in its own 256-byte row of a buffer\n)'
  replace: "        #[cfg(target_arch = \"wasm32\")]\n        {\n            let mut read: HashMap<LayerId, u8> = HashMap::new();\n            for id in &ids {\n                let Some(layer) = self.layers.get(id) else { continue };\n                let at = IRect { x0: x as i32, y0: y as i32, x1: x as i32 + 1, y1: y as i32 + 1 };\n                let pixel = crate::web::read(gpu, &layer.texture, at).pixels()?;\n                read.insert(*id, pixel.get(3).copied().unwrap_or(0));\n            }\n            return Ok(paint.iter().filter_map(|id| Some((*id, *read.get(id).or_else(|| parked.get(id))?))).collect());\n        }\n$1"

# The modules that use the clock, files, threads or `process::id` take `std` from the std shim on wasm (and `pollster`,
# where they wait for the GPU). Found with: every non-test module that names Instant, SystemTime, fs::, File::, env::, thread::,
# process:: or a path's exists, is_file or is_dir, and runs on the page. If upstream starts using these in another module, give it
# the same line; a missing one panics at the first clock call (the page then stops) or fails that file call ("operation not supported
# on this platform"). A `Path`'s own `exists`, `is_file` and `is_dir` are the real std's methods, which a shadowed `std` can't
# reach: they answer no. A `PathBuf`'s answer from the in-memory files where the module takes `PathExt` too (the gallery's folders
# and an artwork's layer files are looked for that way: without it the gallery lists nothing and an artwork opens with no layers).
- {file: crates/engine/src/fill.rs, find: &end '(?![\s\S])', after: &cstd "\n// Playground's browser build: the clock, files and threads (patches/procreate.yaml).\n#[cfg(target_arch = \"wasm32\")]\nuse crate::playground::std;\n"}
- {file: crates/engine/src/par.rs, find: *end, after: *cstd}
- {file: crates/engine/src/selection.rs, find: *end, after: *cstd}
- {file: crates/engine/src/textures.rs, find: *end, after: *cstd}
- {file: crates/engine/src/usd.rs, find: *end, after: *cstd}
- {file: crates/engine/src/zip.rs, find: *end, after: *cstd}
- {file: crates/gpu/src/canvas/plugin_filter.rs, find: *end, after: &std "\n// Playground's browser build: the clock, files and threads (patches/procreate.yaml).\n#[cfg(target_arch = \"wasm32\")]\nuse procraft_engine::playground::std;\n"}
