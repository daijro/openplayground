# `Path::metadata` (the real std's) gives the real SystemTime, which web-time's epoch can't be taken from: the real std's own.
- file: desktop/src/canvas_info.rs
  find: 't\.duration_since\(std::time::UNIX_EPOCH\)'
  replace: 't.duration_since(::std::time::UNIX_EPOCH)'

# A pen's readings (index.html) are handed to the brushes as X11 hands those of a tablet's pen, which winit gives as the
# mouse.
- file: desktop/src/pen.rs
  find: '^fn set_mouse_pen\('
  replace: 'pub(crate) fn set_mouse_pen('

# `main` on wasm is web.rs's `start`, which asks for the GPU and then runs the desktop's `main` (now `run`) on the
# canvas: the window takes the page's canvas (and then follows the page's size), the event loop is winit's `spawn_app` (which doesn't
# end), the page looks at what came in after each event, and Save keeps the painting in Files instead of the gallery. The log is the
# browser's console (startup::init is the desktop's, to files and a crash restarter).
- file: desktop/src/main.rs
  find: '^mod video;\n'
  after: "#[cfg(target_arch = \"wasm32\")]\nmod web;\n"
- file: desktop/src/main.rs
  find: '^fn main\(\) \{\n'
  replace: "#[cfg(target_arch = \"wasm32\")]\nfn main() {\n    web::start();\n}\n\n#[cfg(not(target_arch = \"wasm32\"))]\nfn main() {\n    run();\n}\n\nfn run() {\n"
- file: desktop/src/main.rs
  find: '^    startup::init\(\);\n'
  replace: "    #[cfg(not(target_arch = \"wasm32\"))]\n    startup::init();\n"
- file: desktop/src/main.rs
  find: '(    event_loop\.set_control_flow\(ControlFlow::Wait\);\n)'
  replace: "$1    #[cfg(target_arch = \"wasm32\")]\n    web::keep_proxy(event_loop.create_proxy());\n"
- file: desktop/src/main.rs
  find: '(\.with_active\(std::env::var_os\("PROCRAFT_BACKGROUND"\)\.is_none\(\)\);\n)'
  replace: "$1        #[cfg(target_arch = \"wasm32\")]\n        let attributes = {\n            use winit::platform::web::WindowAttributesExtWebSys;\n            attributes.with_canvas(web::canvas())\n        };\n"
- file: desktop/src/main.rs
  find: 'Ok\(w\) => Arc::new\(w\),\n'
  replace: "Ok(w) => {\n                #[cfg(target_arch = \"wasm32\")]\n                web::fit();\n                Arc::new(w)\n            }\n"
- file: desktop/src/main.rs
  find: '(    fn about_to_wait\(&mut self, event_loop: &ActiveEventLoop\) \{\n)'
  replace: "$1        #[cfg(target_arch = \"wasm32\")]\n        self.web_after();\n"
- file: desktop/src/main.rs
  find: '(            Action::Save => \{\n)                self\.keep_artwork\(\);\n'
  replace: "$1                #[cfg(target_arch = \"wasm32\")]\n                files::save(session, &mut self.ui, false);\n                #[cfg(not(target_arch = \"wasm32\"))]\n                self.keep_artwork();\n"
- file: desktop/src/main.rs
  find: '^    match std::panic::catch_unwind\(std::panic::AssertUnwindSafe\(\|\| event_loop\.run_app\(&mut app\)\)\) \{\n'
  before: "    #[cfg(target_arch = \"wasm32\")]\n    {\n        // the page's loop, which doesn't end\n        use winit::platform::web::EventLoopExtWebSys;\n        event_loop.spawn_app(app);\n        return;\n    }\n"
