# What the one thread can't do as a thread did. Opening an artwork reads its layers on workers that send them over a
# channel with room for a few: run at once, the first would fill it and wait for a reader that never comes, so it has room for
# them all. The text's drawing thread waits for work with a Condvar: it draws in the frame. And the time-lapse isn't recorded.
- file: crates/core/src/lib.rs
  find: '(            let \(send, receive\) = )(std::sync::mpsc::sync_channel\(workers\);\n)'
  replace: "            #[cfg(target_arch = \"wasm32\")]\n            let (send, receive) = std::sync::mpsc::channel();\n            #[cfg(not(target_arch = \"wasm32\"))]\n$1$2"
- file: desktop/src/text.rs
  find: '(    fn ask\(&mut self, ctx: &egui::Context, job: TextDraw\) \{\n)'
  replace: "$1        #[cfg(target_arch = \"wasm32\")]\n        {\n            self.asked += 1;\n            let drawn = job.draw();\n            *self.shared.drawn.lock().unwrap_or_else(PoisonError::into_inner) = Some((self.asked, drawn));\n            ctx.request_repaint();\n            return;\n        }\n"
# The gallery's thumbnails are read on a thread that waits for what to read (it never starts here): those asked for are read in the
# frame, once.
- file: desktop/src/gallery.rs
  find: 'if reader\.asks\.send\(\(asked\.0\.clone\(\), asked\.1, path\)\)\.is_ok\(\) \{'
  replace: 'if cfg!(target_arch = "wasm32") || reader.asks.send((asked.0.clone(), asked.1, path)).is_ok() {'
- file: desktop/src/gallery.rs
  find: '(    fn thumbnails_read\(&mut self, ctx: &egui::Context\) \{\n)'
  replace: "$1        #[cfg(target_arch = \"wasm32\")]\n        {\n            let crisp = egui::TextureOptions { magnification: egui::TextureFilter::Nearest, ..egui::TextureOptions::LINEAR };\n            for (dir, when) in std::mem::take(&mut self.reading) {\n                let image = crate::files::read_png(&std::path::Path::new(&dir).join(\"thumbnail.png\"))\n                    .ok()\n                    .filter(|image| image.rgba.len() == image.width as usize * image.height as usize * 4)\n                    .map(|image| egui::ColorImage::from_rgba_unmultiplied([image.width as usize, image.height as usize], &image.rgba));\n                let texture = image.map(|pixels| ctx.load_texture(format!(\"thumbnail {dir}\"), pixels, crisp));\n                self.thumbs.insert(dir, (when, texture));\n                ctx.request_repaint();\n            }\n            return;\n        }\n"
- file: desktop/src/timelapse.rs
  find: '(    pub fn record\(&mut self, ctx: &egui::Context, session: &Arc<CanvasSession>, idle: bool\) \{\n)'
  replace: "$1        #[cfg(target_arch = \"wasm32\")]\n        {\n            let _ = (ctx, session, idle);\n            return;\n        }\n"

