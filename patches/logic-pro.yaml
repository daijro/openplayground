# Pro Wave in the browser. Upstream (github.com/fabox-os/Pro-Wave) releases desktop packages only; these patches add
# the web build Playground serves, from its head commit.
#
# patches/logic-pro/web.diff adds new files only:
#   index.html, Trunk.toml         the web build at the repository's root (build.mjs builds there): trunk builds
#                                  crates/prowave-app's `prowave` binary for the page's canvas, and the page starts the
#                                  engine's audio at the first click or key (browsers keep it off until then).
#   crates/prowave-app/src/web.rs  the page's side: on the web the crate root takes `eframe` from here, whose
#                                  `run_native` builds the app with the desktop's own creator (main runs as on the
#                                  desktop) and starts it on the canvas; File > Open… and Save As… are Playground's
#                                  dialogs; "Open in Pro-Wave" opens a project or imports an audio file; what Pro Wave
#                                  saves goes to Files; dropped files work.
#   crates/prowave-engine/src/disk/web.rs   disk streaming without its thread: the clips are read in turns each time
#                                  the engine renders a block, on the page's one thread.
#   crates/prowave-playground/     what wasm32-unknown-unknown lacks: `std` with web-time's clock, an in-memory file
#                                  system, `thread::spawn` queued for after the frame (waveform overviews),
#                                  `env::temp_dir`, `HOME` (settings in memory) and `process::id`. The
#                                  modules that use them take `std` from it on wasm through ONE `use` line at their end
#                                  (a local `std` shadows the standard library's name in that module; everything else
#                                  in it still comes from the real std).
# Native builds see none of this: every rule adds wasm-only lines.

# Rules 1-4/28: the wasm-only dependencies, each in a table under a target spelling nobody else uses (`all(...)`), so
# it never meets one of upstream's. cpal's `wasm-bindgen` feature is its Web Audio host (the version follows
# upstream's); uuid (accesskit, human-panic) takes the browser's random numbers.
- file: crates/prowave-app/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nprowave-playground = { path = \"../prowave-playground\" }\nuuid = { version = \"1\", features = [\"js\"] }\nwasm-bindgen = \"0.2\"\nwasm-bindgen-futures = \"0.4\"\njs-sys = \"0.3\"\ngetrandom = { version = \"0.3\", features = [\"wasm_js\"] }\nring = { version = \"0.17\", features = [\"wasm32_unknown_unknown_js\"] }\nrustls-pki-types = { version = \"1\", features = [\"web\"] }\nweb-sys = { version = \"0.3\", features = [\"Window\", \"Document\", \"Element\", \"HtmlCanvasElement\", \"console\"] }\n"
# getrandom 0.3 (ahash, ring) has no wasm backend unless the `wasm_js` feature (above) and this cfg are both on.
- file: .cargo/config.toml
  find: '(?![\s\S])'
  after: "\n[target.wasm32-unknown-unknown]\nrustflags = [\"--cfg\", \"getrandom_backend=\\\"wasm_js\\\"\"]\n"
- file: crates/prowave-engine/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nprowave-playground = { path = \"../prowave-playground\" }\ncpal = { version = \"*\", features = [\"wasm-bindgen\"] }\n"
- file: crates/prowave-project/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nprowave-playground = { path = \"../prowave-playground\" }\n"

# Rules 5-20/28: the modules that use the clock, files, threads, the temp folder or the process id take `std` from
# crates/prowave-playground on wasm (see the top). Found with: every non-test module that names Instant, SystemTime,
# fs::, File::, thread::spawn, env:: or process::id, except prowave-engine's mapped.rs (memory maps, which upstream
# already leaves out on wasm) and updater.rs (off on the web, rule 25). If upstream starts using these in another
# module, give it the same line; a missing one panics at the first clock, file or thread call (Pro Wave then never gets
# past "Loading Pro Wave…").
- file: crates/prowave-engine/src/disk.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the files, and the streaming done in turns (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n#[cfg(target_arch = \"wasm32\")] mod web;\n#[cfg(target_arch = \"wasm32\")] pub(crate) use web::pump;\n"
- file: crates/prowave-engine/src/output.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-project/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the files (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/project_io.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the files, the temp folder and the process id (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/import.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the waveform worked out in place (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/bench.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/recent_files.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: settings in memory (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/ui_scale.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: settings in memory (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-engine/src/flex.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the files (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/main.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (MIDI time code), the files and the temp folder (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/midi_in.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/midi_out.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/mtc_in.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/scripter.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/flex_edit.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the files, the temp folder and the process id (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/midi_file.rs
  find: '(?![\s\S])'
