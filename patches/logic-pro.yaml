# Rules 21-22/28: disk streaming on the web (crates/prowave-engine/src/disk/web.rs): no thread is started, and the
# engine reads the clips in turns before each block it renders. If upstream renames `DiskThread::spawn` or
# `EngineCore::process`, follow.
- file: crates/prowave-engine/src/disk.rs
  find: '\bpub\s+fn\s+spawn\s*\(\s*\)\s*->\s*Self\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] return web::spawn();"
- file: crates/prowave-engine/src/core.rs
  find: '\bpub\s+fn\s+process\s*\(\s*&mut\s+self\s*,\s*out\s*:\s*&mut\s*\[f32\]\s*\)\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] crate::disk::pump();"

# Rules 23-28/28: the app. main runs as on the desktop with `eframe` from web.rs (its `run_native` starts the page);
# the log goes nowhere on the web (its timestamps would read the clock std lacks); no automatic update check (Playground
# serves new builds; the check would read the clock and start a thread at startup); the desktop's graphics choice
# (which probes OpenGL) is the page's default; File > Open… and Save As… use Playground's dialogs; and the window
# has no buttons of its own (minimize, maximize, close) in a browser tab. If upstream renames what these anchor on,
# follow.
- file: crates/prowave-app/src/main.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] mod web;\n#[cfg(target_arch = \"wasm32\")] use web::{eframe, rfd};\n"
- file: crates/prowave-app/src/main.rs
  find: '\bfn\s+init_logging\s*\(\s*\)\s*\{'
  after: "\n    #[cfg(target_arch = \"wasm32\")] return;"
- file: crates/prowave-app/src/updater.rs
  find: '\bpub\s+fn\s+auto_enabled\s*\(\s*\)\s*->\s*bool\s*\{'
  after: "\n    #[cfg(target_arch = \"wasm32\")] return false;"
- file: crates/prowave-app/src/graphics.rs
  find: '\bpub\s+fn\s+config\s*\(\s*\)\s*->\s*WgpuConfiguration\s*\{'
  after: "\n    #[cfg(target_arch = \"wasm32\")] return WgpuConfiguration::default();"
- file: crates/prowave-app/src/file_commands.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: Playground's file dialogs (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::web::rfd;\n"
- file: crates/prowave-app/src/inspector.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: Playground's file dialogs (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::web::rfd;\n"
- file: crates/prowave-app/src/file_browser.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: no folder dialog (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::web::rfd;\n"
# Audio input (capture.rs): upstream leaves it out on wasm, but the app uses InputSource and MAX_INPUT_CHANNELS
# everywhere, so the module is built on the web too (its std from crates/prowave-playground like the others). If
# upstream gates the app's use of it instead, delete these three rules.
- file: crates/prowave-engine/src/lib.rs
  find: '#\[cfg\(not\(target_arch = "wasm32"\)\)\]\s*mod\s+capture\s*;'
  replace: 'mod capture;'
- file: crates/prowave-engine/src/lib.rs
  find: '#\[cfg\(not\(target_arch = "wasm32"\)\)\]\s*pub\s+use\s+crate::capture::'
  replace: 'pub use crate::capture::'
- file: crates/prowave-engine/src/capture.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the files, threads and clock (patches/logic-pro.yaml).\n#[cfg(target_arch = \"wasm32\")] use prowave_playground::std;\n"
- file: crates/prowave-app/src/window_chrome.rs
  find: '\bpub\s+const\s+CUSTOM\s*:\s*bool\s*=\s*([^;]+);'
  replace: 'pub const CUSTOM: bool = $1 && !cfg!(target_arch = "wasm32");'

# Live editing in Playground sessions (patches/logic-pro/live.diff + the playground-live crate, tools.yaml `live_kit`)
# What it's for: people in a Playground session work on the same project at once: tracks (adding, removing, stacking,
#   names, instruments and patches, mute and solo, volume, pan, sends, inspector values), regions (adding, moving,
#   repeating, resizing, removing, their inspector values) and notes, the tempo, signature, key and master volume reach
#   the others as they are made; two people's edits to different tracks, regions or notes (even of one region) both
#   stay; each person's Ctrl+Z takes back only their own edits; audio files travel as the session's media, so joining
#   from a link needs no files. Each sees the others' pointers with name tags in the Tracks area and the Piano Roll, and
#   their drags as they happen (a region being moved, notes being moved, resized or drawn), and on the channel strips
#   (Mixer, Inspector) their pointers with the volume they set. Personal, never shared:
#   playing and the playhead, the cycle, metronome and count-in, the selection, each track's height and folding.
# How: the adapter lives in new files: crates/prowave-app/src/live.rs (the shared document: the project file's JSON,
#   with ids for tracks and regions followed beside the model, a note's being the note itself; the merge; putting a
#   document back in; media; the window wrapped with the session's frame; the session is the playground-live crate,
#   patches/live/kit, as `kit`) and live/peers.rs (presence, drawn in the crate's look). These rules only add the crate
#   (with its egui look; wasm, and the native tests), declare the module and call in, one line each.
# Verify: node scripts/build.mjs check logic-pro head (and LIVE=0), the e2e (tests/live-apps/logic-pro.mjs) and
#   `cargo test -p prowave-app live`.
# If upstream changes: when a line named below changes, anchor on its new spelling; if App, UiState or History rename
#   the fields live.rs uses (project, ui.tracks.selected, ui.piano.selected, history), follow them there.
- live: true
  file: crates/prowave-app/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(any(target_arch = \"wasm32\"))'.dependencies]\nplayground-live = { path = \"../../playground-live\", features = [\"egui\"] }\n\n[target.'cfg(not(target_arch = \"wasm32\"))'.dev-dependencies]\nplayground-live = { path = \"../../playground-live\", features = [\"egui\"] }\n"
- live: true
  file: crates/prowave-app/src/main.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only, and its native tests).\n#[cfg(any(target_arch = \"wasm32\", test))]\nmod live;\n"
- live: true
  file: crates/prowave-app/src/web.rs
  find: 'Box::new\(Web::new\(app\)\)'
  replace: 'crate::live::wrap(Web::new(app))'
- live: true
  file: crates/prowave-app/src/undo.rs
  find: '\bpub\s+fn\s+can_undo\s*\(\s*&self\s*\)\s*->\s*bool\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if crate::live::kit::connected() { return true; }"
- live: true
  file: crates/prowave-app/src/undo.rs
  find: '\bpub\s+fn\s+can_redo\s*\(\s*&self\s*\)\s*->\s*bool\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if crate::live::kit::connected() { return true; }"
- live: true
  file: crates/prowave-app/src/undo.rs
  find: '\bpub\s+fn\s+undo\s*\(\s*&mut\s+self\s*,[^)]*\)\s*->\s*bool\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if crate::live::kit::undo(false) { return false; }"
- live: true
  file: crates/prowave-app/src/undo.rs
  find: '\bpub\s+fn\s+redo\s*\(\s*&mut\s+self\s*,[^)]*\)\s*->\s*bool\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if crate::live::kit::undo(true) { return false; }"
- live: true
  file: crates/prowave-app/src/tracks_area.rs
  find: 'let\s+\(scroll_x,\s*scroll_y\)\s*=\s*\(v\.scroll_x,\s*v\.scroll_y\);'
  after: "\n    #[cfg(target_arch = \"wasm32\")] crate::live::lanes(lanes, &rows, scroll_x, scroll_y, beat_px);"
- live: true
  file: crates/prowave-app/src/piano_roll.rs
  find: 'let\s+\(beat_px,\s*key_h,\s*scroll_x,\s*scroll_y\)\s*=\s*\(v\.beat_px,\s*v\.key_h,\s*v\.scroll_x,\s*v\.scroll_y\);'
  after: "\n    #[cfg(target_arch = \"wasm32\")] crate::live::piano(grid, (ti, ri), beat_px, key_h, scroll_x, scroll_y);"
- live: true
  file: crates/prowave-app/src/mixer.rs
  find: '\bpub\s+fn\s+channel_strip\s*\([\s\S]*?\)\s*\{'
  after: "\n    #[cfg(target_arch = \"wasm32\")] crate::live::strip(strip, key, ns);"
