# The app: the page's side (web.rs), the clock and files. `main` runs as on the desktop with web.rs's start first; File >
# Open…, Save As… and Export PDF… hand over to web.rs (Playground's dialogs); Save of a score that was downloaded asks
# where again; the unsaved state goes to Playground's leave warning; the plugin manager and plugins' settings windows
# say the plugins are built in; Quit does nothing; links open in a new tab. If upstream renames what these anchor on,
# follow.
- file: crates/oxiguitar-app/src/main.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the page's side, the desktop's file dialogs it never opens, the clock (patches/guitar-pro.yaml).\n#[cfg(target_arch = \"wasm32\")]\nmod web;\n#[cfg(target_arch = \"wasm32\")]\nuse web::rfd;\n#[cfg(target_arch = \"wasm32\")]\nuse oxiguitar_playground::std;\n"
- file: crates/oxiguitar-app/src/main.rs
  find: '^fn main\(\) -> Result<\(\), slint::PlatformError> \{'
  after: "\n    #[cfg(target_arch = \"wasm32\")]\n    web::start();"
- file: crates/oxiguitar-app/src/main.rs
  find: 'oxiguitar_host::start\(oxiguitar_host::Folders::here\(\), display_system\(\), core\)\n[ \t]*\};'
  after: "\n    #[cfg(target_arch = \"wasm32\")]\n    let startup = web::started(startup);"
# Help > About: in the browser, Play downloads the sound set the first time; say so, and whose it is.
- file: crates/oxiguitar-app/src/main.rs
  find: '^[ \t]*about\.extend\(about_folders\('
  before: "    #[cfg(target_arch = \"wasm32\")]\n    about.retain(|l| !l.starts_with(\"OxiGuitar never connects\"));\n    #[cfg(target_arch = \"wasm32\")]\n    about.push(\"In the browser (Playground), Play downloads the sound set the first time it is pressed: GeneralUser GS 2.0.3, by S. Christian Collins. Nothing else is fetched, and nothing is sent anywhere.\".to_owned());\n"
- file: crates/oxiguitar-app/src/main.rs
  find: '^[ \t]*ui\.run\(\)\?;'
  before: "    #[cfg(target_arch = \"wasm32\")]\n    web::ready();\n"
- file: crates/oxiguitar-app/src/main.rs
  find: '^fn open_dialog\(app: &Shared\) \{'
  after: "\n    #[cfg(target_arch = \"wasm32\")]\n    return web::open_dialog(app);"
- file: crates/oxiguitar-app/src/main.rs
  find: '^fn save_as_dialog\(app: &Shared\) \{'
  after: "\n    #[cfg(target_arch = \"wasm32\")]\n    return web::save_as_dialog(app);"
- file: crates/oxiguitar-app/src/main.rs
  find: '^fn export_dialog\(app: &Shared\) \{'
  after: "\n    #[cfg(target_arch = \"wasm32\")]\n    return web::export_dialog(app);"
- file: crates/oxiguitar-app/src/main.rs
  find: '^fn save\(app: &Shared\) \{'
  after: "\n    #[cfg(target_arch = \"wasm32\")]\n    if web::downloaded(app) {\n        return save_as_dialog(app);\n    }"
- file: crates/oxiguitar-app/src/main.rs
  find: '^[ \t]*s\.modified = edit\.modified;'
  after: "\n        #[cfg(target_arch = \"wasm32\")]\n        web::unsaved(edit.modified);"
- file: crates/oxiguitar-app/src/main.rs
  find: '^fn open_plugin_manager\(app: &Shared\) \{'
  after: "\n    #[cfg(target_arch = \"wasm32\")]\n    return web::no_plugin_windows(app);"
- file: crates/oxiguitar-app/src/main.rs
  find: '^fn open_settings_window\(app: &Shared, id: String\) \{'
  after: "\n    #[cfg(target_arch = \"wasm32\")]\n    return web::no_plugin_windows(app);"
- file: crates/oxiguitar-app/src/main.rs
  find: '^([ \t]*)Then::Quit => \{'
  after: "\n            // A page isn't quit: its tab is closed.\n            #[cfg(target_arch = \"wasm32\")]\n            return;"
- file: crates/oxiguitar-app/src/links.rs
  find: 'pub\(crate\) fn open\(url: &str\) -> Result<\(\), String> \{'
  after: "\n    #[cfg(target_arch = \"wasm32\")]\n    return crate::web::open_link(url);"
- file: crates/oxiguitar-app/src/editing.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/guitar-pro.yaml).\n#[cfg(target_arch = \"wasm32\")]\nuse oxiguitar_playground::std;\n"
- file: crates/oxiguitar-app/src/document.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the files in memory, the worker's channel (patches/guitar-pro.yaml).\n#[cfg(target_arch = \"wasm32\")]\nuse oxiguitar_playground::std;\n"

# The worker, the player's thread and the plugin tabs' thread: each `run` is a loop that sleeps on a channel, which the
# page's one thread can't. On the web each is the same loop, copied whole as an async function whose one `recv()` is
# awaited (oxiguitar-playground's channel), and started as a task of the page where upstream starts its thread. The
# copies are made from upstream's code at build time, so its changes to the loops come along; if a loop gets a second
# `recv()` (or a `recv_timeout`), await it too, and if upstream renames `run` or the thread's variables, follow.
- file: crates/oxiguitar-app/src/worker.rs
  find: '^fn run\(rx: &Receiver<Request>[\s\S]*?\n\}\n'
  replace: "#[cfg(not(target_arch = \"wasm32\"))]\n$&\n// Playground's browser build: the same loop, as a task of the page (patches/guitar-pro.yaml).\n#[cfg(target_arch = \"wasm32\")]\nasync $&"
- file: crates/oxiguitar-app/src/worker.rs
  find: '(async fn run\(rx: &Receiver<Request>[\s\S]*?)rx\.recv\(\)'
  replace: '$1rx.recv().await'
- file: crates/oxiguitar-app/src/worker.rs
  find: 'let thread = std::thread::Builder::new\(\)[\s\S]*?\.ok\(\);'
  replace: "#[cfg(not(target_arch = \"wasm32\"))]\n        $&\n        #[cfg(target_arch = \"wasm32\")]\n        let thread = Some(std::thread::task(async move { run(&rx, plugins, open, &sink).await }));"
- file: crates/oxiguitar-app/src/worker.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the channel, the task, the files in memory (patches/guitar-pro.yaml).\n#[cfg(target_arch = \"wasm32\")]\nuse oxiguitar_playground::std;\n"
- file: crates/oxiguitar-app/src/sound.rs
  find: '^    (fn run\(mut self, from: &Receiver<ToSound>\) \{[\s\S]*?\n    \}\n)'
  replace: "    #[cfg(not(target_arch = \"wasm32\"))]\n    $1\n    // Playground's browser build: the same loop, as a task of the page (patches/guitar-pro.yaml).\n    #[cfg(target_arch = \"wasm32\")]\n    async $1"
- file: crates/oxiguitar-app/src/sound.rs
  find: '(async fn run\(mut self, from: &Receiver<ToSound>\)[\s\S]*?)from\.recv\(\)'
  replace: '$1from.recv().await'
- file: crates/oxiguitar-app/src/sound.rs
  find: 'let thread = std::thread::Builder::new\(\)\s*\.name\("oxiguitar-sound"\.into\(\)\)\s*\.spawn\(move \|\| \{([\s\S]*?)\.run\(&from\);\s*\}\)\s*\.ok\(\);'
  replace: "#[cfg(not(target_arch = \"wasm32\"))]\n        $&\n        #[cfg(target_arch = \"wasm32\")]\n        let thread = Some(std::thread::task(async move {$1.run(&from).await }));"
- file: crates/oxiguitar-app/src/sound.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the channel, the task (patches/guitar-pro.yaml).\n#[cfg(target_arch = \"wasm32\")]\nuse oxiguitar_playground::std;\n"
- file: crates/oxiguitar-app/src/plugin_tabs.rs
  find: '^fn run\(rx: &Receiver<Request>, plugins: &Plugins[\s\S]*?\n\}\n'
  replace: "#[cfg(not(target_arch = \"wasm32\"))]\n$&\n// Playground's browser build: the same loop, as a task of the page (patches/guitar-pro.yaml).\n#[cfg(target_arch = \"wasm32\")]\nasync $&"
- file: crates/oxiguitar-app/src/plugin_tabs.rs
  find: '(async fn run\(rx: &Receiver<Request>, plugins: &Plugins[\s\S]*?)rx\.recv\(\)'
  replace: '$1rx.recv().await'
- file: crates/oxiguitar-app/src/plugin_tabs.rs
  find: 'let thread = std::thread::Builder::new\(\)[\s\S]*?\.ok\(\);'
  replace: "#[cfg(not(target_arch = \"wasm32\"))]\n        $&\n        #[cfg(target_arch = \"wasm32\")]\n        let thread = Some(std::thread::task(async move { run(&rx, &plugins, dark, &sink).await }));"
- file: crates/oxiguitar-app/src/plugin_tabs.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the channel, the task (patches/guitar-pro.yaml).\n#[cfg(target_arch = \"wasm32\")]\nuse oxiguitar_playground::std;\n"

# The player: the sound set is fetched the first time Play is pressed (web.rs), so until then Play stays available
# and the player doesn't say it has no sound set; once the instruments are ready, what was asked plays.
- file: crates/oxiguitar-app/src/playing.rs
  find: 'pub\(crate\) fn action\(app: &Shared, name: &str\) \{'
  after: "\n    #[cfg(target_arch = \"wasm32\")]\n    if crate::web::sound_set_first(name) {\n        return;\n    }"
- file: crates/oxiguitar-app/src/playing.rs
  find: '^[ \t]*FromSound::Ready\(ready\) => \{'
  after: "\n            #[cfg(target_arch = \"wasm32\")]\n            crate::web::sound_ready(app);"
- file: crates/oxiguitar-app/src/playing.rs
  find: 'fn tell_once\(app: &Shared, level: Level, text: String, link: Option<\(&str, &str\)>\) \{'
  after: "\n    #[cfg(target_arch = \"wasm32\")]\n    if crate::web::quiet(&text) {\n        return;\n    }"
- file: crates/oxiguitar-app/src/playing.rs
  find: '^[ \t]*ui\.set_player_available\(available\);'
  before: "    #[cfg(target_arch = \"wasm32\")]\n    let (available, why) = if has_score && s.outputs_available && crate::web::sound_set_missing() {\n        (true, String::new())\n    } else {\n        (available, why)\n    };\n"
- file: crates/oxiguitar-app/src/playing.rs
  find: '^[ \t]*if name == " " && !shift && !ctrl && !alt \{'
  before: "    #[cfg(target_arch = \"wasm32\")]\n    if name == \" \" && !shift && !ctrl && !alt && crate::web::sound_set_missing() && app.borrow().track_count > 0 {\n        action(app, \"play\");\n        return true;\n    }\n"
