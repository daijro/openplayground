# NoteCraft in the browser. Upstream ships a desktop window only; these patches add the web build Playground serves.
#
# patches/onenote/web.diff adds new files only:
#   apps/notecraft-web/          the web crate build.mjs finds (Cargo.toml, Trunk.toml, index.html, src/main.rs): the
#                                desktop window (crates/ui-egui) on the page's canvas; the notebooks folder kept in
#                                Playground's Files as plain folders (browser:/NoteCraft/…), the sample notebooks on
#                                the first start, pictures read from the folder, dropped files, "Open in NoteCraft",
#                                the CJK face as a file beside the page (fetched when a page needs it), and a pen's
#                                pressure from pointer events (eframe passes them on without it).
#   crates/model/src/playground.rs  web shims for the library: an in-memory `std::fs` that notes every change, and
#                                web-time's clock (wasm32-unknown-unknown has neither; SystemTime::now panics there).
#   crates/ui-egui/src/playground_clipboard.rs  the `arboard` crates/ui-egui/src/clipboard.rs reads, from the
#                                browser's clipboard (arboard has none for the browser).
# The modules that use files or the clock take `std` from crates/model/src/playground.rs on wasm through ONE `use`
# line at their end (a local `std` shadows the standard library's name in that module; everything else in it still
# comes from the real std). Path::is_file / is_dir ask the real file system, so the three calls the tree needs read
# the same through `fs::metadata` (what those methods do). Native builds see none of this: every rule adds wasm-only
# lines, or an expression that does exactly what it replaces.
# If upstream starts using std::fs or Instant in another module, give that module the same one-line rule.

# Rule 1/29: web-time for the shims (already in Cargo.lock through eframe).
# Verify: build.mjs check. If upstream adds it itself, drop it here.
- file: crates/model/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nweb-time = \"1\"\n"

# Rule 1b/29: the web build's own profile (apps/notecraft-web/index.html names it): release with whole-program
# optimisation, as the ArtCraft web profiles do (PhotoCraft's wasm-release): 13.4 -> 11.2 MB of wasm, 5.6 -> 4.5 MB
# gzipped. A table of its own, so upstream's [profile.release] stays as it is.
# If upstream adds a profile of this name, rename it here and in index.html.
- file: Cargo.toml
  find: '(?![\s\S])'
  after: "\n# Playground's web build (patches/onenote.yaml): release with whole-program optimisation.\n[profile.playground-web]\ninherits = \"release\"\nlto = \"fat\"\ncodegen-units = 1\n"

# Rule 2/29: the shims, as notecraft_model::playground on wasm.
- file: crates/model/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build (patches/onenote.yaml): files and the clock in the browser.\n#[cfg(target_arch = \"wasm32\")] #[doc(hidden)] pub mod playground;\n"

# Rules 3-11/29: the clock (ids, timestamps, the autosave timer) and the files (the tree, pages, attachments,
# settings, the session's folder) of the library's modules (see the top).
- file: crates/model/src/id.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::playground::std;\n"
- file: crates/model/src/time.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::playground::std;\n"
- file: crates/store/src/tree.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: files (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use notecraft_model::playground::std;\n"
- file: crates/store/src/page.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: files and the clock (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use notecraft_model::playground::std;\n"
- file: crates/store/src/ops.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: files (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use notecraft_model::playground::std;\n"
- file: crates/store/src/assets.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: files (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use notecraft_model::playground::std;\n"
- file: crates/store/src/settings.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: files (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use notecraft_model::playground::std;\n"
- file: crates/engine/src/session.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: files (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use notecraft_model::playground::std;\n"
- file: crates/ui-egui/src/app.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: files and the clock (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use notecraft_model::playground::std;\n"

# Rules 12-15/29: the page file, the child folders, the attachments and the page open last, as `fs::metadata` reads
# them (Path::is_file and is_dir are exactly that, through the real file system).
# Verify: the tree shows the notebooks and a page with a picture lists it. If upstream changes: anchor on the
# function that finds a page's file / lists child folders.
- file: crates/store/src/tree.rs
  find: '\|\(_,\s*p\)\|\s*p\.is_file\(\)'
  replace: '|(_, p)| fs::metadata(p).is_ok_and(|m| m.is_file())'
- file: crates/store/src/tree.rs
  find: '\.filter\(\|p\|\s*p\.is_dir\(\)\)'
  replace: '.filter(|p| fs::metadata(p).is_ok_and(|m| m.is_dir()))'
- file: crates/store/src/assets.rs
  find: '\.filter\(\|e\|\s*e\.path\(\)\.is_file\(\)\)'
  replace: '.filter(|e| fs::metadata(e.path()).is_ok_and(|m| m.is_file()))'
# The page the window closed on opens again (its check asks the file system).
- file: crates/ui-egui/src/app.rs
  find: 'if\s+!path\.is_dir\(\)'
  replace: 'if !std::fs::metadata(&path).is_ok_and(|m| m.is_dir())'

# Rule 16/29: rfd has no FileDialog on wasm; the folder chooser (choose_notebooks_folder) picks nothing there (the
# notebooks folder is Playground's Files). Native builds keep the dialog.
# Verify: build.mjs check. If upstream moves the dialog: anchor on the new rfd call.
- file: crates/ui-egui/src/app.rs
  find: 'rfd::FileDialog::new\(\)[^;]*?\.pick_folder\(\)'
  replace: '({ #[cfg(not(target_arch = "wasm32"))] { $& } #[cfg(target_arch = "wasm32")] { None::<std::path::PathBuf> } })'
# The import dialogs (import_notebook_folder, import_file), the printout and attachment pickers and the telemetry
# export's save dialog build a dialog value first; on wasm a local `rfd` module with a FileDialog that picks nothing
# shadows the crate's name, so those calls compile and do nothing. If upstream calls another of its methods, add it.
- file: crates/ui-egui/src/app.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: rfd has no dialogs on wasm (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")]\nmod rfd {\n    pub struct FileDialog;\n    impl FileDialog {\n        pub fn new() -> Self { FileDialog }\n        pub fn set_title(self, _: impl Into<String>) -> Self { self }\n        pub fn set_directory(self, _: impl AsRef<std::path::Path>) -> Self { self }\n        pub fn pick_folder(self) -> Option<std::path::PathBuf> { None }\n        pub fn pick_file(self) -> Option<std::path::PathBuf> { None }\n        pub fn set_file_name(self, _: impl Into<String>) -> Self { self }\n        pub fn add_filter(self, _: impl Into<String>, _: &[impl ToString]) -> Self { self }\n        pub fn save_file(self) -> Option<std::path::PathBuf> { None }\n    }\n}\n"

# Rule 17/29: upstream pins its toolchain (rust-toolchain.toml, profile minimal), which rustup installs without the
# wasm target: CI then fails with "can't find crate for `core`". The pin also asks for the target here.
# If upstream lists `targets` itself (or drops the pin), delete this rule.
- file: rust-toolchain.toml
  find: '^\[toolchain\]'
  after: "\ntargets = [\"wasm32-unknown-unknown\"]"

# Rules 18-19/29: the CJK face (16 MB, two copies in the binary: one per crate that names the const) stays out of the
# wasm, which would otherwise be 46 MB, over the host's 25 MiB per file once gzipped. apps/notecraft-web copies the
# file next to the page and loads it when a page needs those scripts (Arabic, Hebrew and Devanagari, 1 MB, stay in);
# the window skips a face it has no bytes for (egui panics on one).
# Verify: the wasm.gz is a few MB, a page in Chinese draws its letters a moment after it opens. If upstream renames
# the const or the font list, follow it (and the file name in apps/notecraft-web/src/main.rs).
- file: crates/text/src/lib.rs
  find: 'pub\s+const\s+CJK\s*:\s*&\[u8\]\s*=\s*include_bytes!\(([^)]*)\);'
  replace: "#[cfg(not(target_arch = \"wasm32\"))] pub const CJK: &[u8] = include_bytes!($1);\n    #[cfg(target_arch = \"wasm32\")] pub const CJK: &[u8] = &[];"
- file: crates/ui-egui/src/fonts.rs
  find: 'for\s*\(\s*name\s*,\s*bytes\s*\)\s*in\s+BUNDLED\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if bytes.is_empty() { continue; }"

# Rules 20-24/29: files in the modules upstream added since: the page's ink (ink.svg beside the page), the Welcome
# notebook (File screen), and links between pages (which ask whether a path is a folder or a file).
- file: crates/ui-egui/src/inkpad.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: files (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use notecraft_model::playground::std;\n"
- file: crates/ui-egui/src/history.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use notecraft_model::playground::std;\n"
- file: crates/engine/src/welcome.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: files (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use notecraft_model::playground::std;\n"
- file: crates/store/src/links.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: files (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] use notecraft_model::playground::std;\n"
- file: crates/store/src/links.rs
  find: '\bif\s+full\.is_dir\(\)'
  replace: 'if std::fs::metadata(&full).is_ok_and(|m| m.is_dir())'
- file: crates/store/src/links.rs
  find: '\bif\s+full\.is_file\(\)'
  replace: 'if std::fs::metadata(&full).is_ok_and(|m| m.is_file())'

# Rules 25-28/29: the clipboard. crates/ui-egui/src/clipboard.rs reads pictures and words through arboard, which has
# no browser clipboard (it does not compile for wasm32: "cannot find `Clipboard` in `platform`"). The web build drops
# the crate and gives that module crates/ui-egui/src/playground_clipboard.rs (web.diff) under the name `arboard`,
# which reads navigator.clipboard. The browser hands it over asynchronously (it may ask the person first), so the
# ribbon's Paste asks for it and stops, and the window runs that Paste again in the frame it arrives. Copy, Cut and
# Ctrl+V never go through this module: egui and the browser carry them as before.
# Verify: build.mjs check; in the browser, copy words (or a picture) and click Home > Paste in a page: they go in at
# the caret. If upstream reads more of arboard (set_text, set_image...), give playground_clipboard.rs the same
# methods; if it moves the dependency or renames paste_here / pending_copy, anchor on the new spelling.
# The dependency, kept for every target but wasm (a new table at the end, with the stand-in's web dependencies).
- file: crates/ui-egui/Cargo.toml
  find: '^(arboard\s*=[^\n]*\n)([\s\S]*)'
  replace: "$2\n# Playground's web build (patches/onenote.yaml): arboard has no browser clipboard.\n[target.'cfg(not(target_arch = \"wasm32\"))'.dependencies]\n$1\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nwasm-bindgen = \"0.2\"\nwasm-bindgen-futures = \"0.4\"\njs-sys = \"0.3\"\n"
- file: crates/ui-egui/src/clipboard.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the browser's clipboard (patches/onenote.yaml).\n#[cfg(target_arch = \"wasm32\")] #[path = \"playground_clipboard.rs\"] pub(crate) mod arboard;\n"
# The Paste waits for the browser's clipboard, then runs again with it.
- file: crates/ui-egui/src/app.rs
  find: '\bfn\s+paste_here\s*\(\s*&mut\s+self\s*\)\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if let Some(note) = crate::clipboard::arboard::ask() { return self.say(note); }"
- file: crates/ui-egui/src/app.rs
  find: 'if\s+let\s+Some\(\s*text\s*\)\s*=\s*self\.pending_copy\.take\(\)'
  before: "#[cfg(target_arch = \"wasm32\")] if crate::clipboard::arboard::arrived(ctx) { self.paste_here(); }\n        "

# Rule 29/29: zip, which the window reads Office packages and writes the telemetry archive with: its default features
# bring AES (getrandom 0.3, which has no wasm backend unless a cfg is set) and C codecs (zstd, lzma), so the web build
# stops at "The wasm32-unknown-unknown targets are not supported by default". The web build takes it with deflate
# only, what those packages use; native builds keep the workspace's (a new table at the end, as rule 25 does).
# Verify: build.mjs check. If upstream drops zip or trims its features itself, delete this rule.
- file: crates/ui-egui/Cargo.toml
  find: '^(zip\s*=[^\n]*\n)([\s\S]*)'
  replace: "$2\n# Playground's web build (patches/onenote.yaml): zip with deflate only.\n[target.'cfg(not(any(target_arch = \"wasm32\")))'.dependencies]\n$1\n[target.'cfg(any(target_arch = \"wasm32\"))'.dependencies]\nzip = { version = \"4\", default-features = false, features = [\"deflate\"] }\n"

# Live editing in Playground sessions (patches/onenote/live.diff + the playground-live crate, tools.yaml `live_kit`)
# What it's for: people in a Playground session write and draw in the same notebooks at once: every keystroke reaches
#   the others, two people typing in one page merge character by character, two people's strokes on one page both
#   stay, each person's Ctrl+Z (and the Draw tab's Undo stroke) takes back only their own edits, and each sees where
#   the others are (a dot in the tree), their caret, the stroke they are drawing and their pointer, in their colour.
# How: the adapter lives in new files: crates/ui-egui/src/app/live.rs (the shared document: the notebooks folder's
#   files; merge, adopt, media), app/live/text.rs (the text merge), app/live/peers.rs (presence: pointers, name tags,
#   colors and easing the kit's; the tree's dots, carets, selections and strokes being drawn NoteCraft's own) and
#   apps/notecraft-web/src/live.rs (the kept runner, the app wrapped with the session's frame hook, Ctrl+Z/Ctrl+Y to
#   the session). The playground-live crate (patches/live/kit) is the session and the presence look. These rules only
#   declare them and call in, one line each.
# Verify: node scripts/build.mjs check onenote head (and LIVE=0), the e2e (tests/live-apps/onenote.mjs) and
#   `cargo test -p notecraft-ui-egui live`.
# If upstream changes: when a line named below changes, anchor on its new spelling; if NoteCraftApp or Editor rename
#   the fields live.rs uses (session, editor, selected, backstage, status, pad; dir, format, body, blocks, caret,
#   dirty_since, title, title_buf, writable, attachments, boxes, page_dir), follow them there.
#
# The playground-live crate (patches/live/kit: the session and the presence look, `egui`), for the web build and the
# native tests (serde_json is already a dependency; wasm-bindgen is rule 25's).
- live: true
  file: crates/ui-egui/Cargo.toml
  find: '^\[dependencies\]\n'
  after: "playground-live = { path = \"../../playground-live\", features = [\"egui\"] }\n"
# The adapter module, a child of the window's module so it reaches NoteCraftApp and the page editor.
- live: true
  file: crates/ui-egui/src/app.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only, and its native tests).\n#[cfg(any(target_arch = \"wasm32\", test))]\npub mod live;\n"
# The page: where it is drawn before its blocks, and the others' carets and pointers after them.
- live: true
  file: crates/ui-egui/src/app.rs
  find: 'let\s+(?:mut\s+)?moved\s*=\s*(?:crate::containers::show\(|if\s+\w+\s*\{\s*crate::containers::show)[^;]*;'
  before: "#[cfg(target_arch = \"wasm32\")] live::page_start(ui);\n                            "
  after: "\n                            #[cfg(target_arch = \"wasm32\")] live::page_end(ui, ed, &tokens);"
# Where each block of the page starts, how wide its column is and which ui it is in (for the others' carets, and
# this person's text box after a remote change).
- live: true
  file: crates/ui-egui/src/pageedit.rs
  find: 'for\s+i\s+in\s+(?:0|range\.start)\.\.[^{;]*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] crate::app::live::block_top(i, ui);"
# Each tree row as drawn (the others' dots go on it).
- live: true
  file: crates/ui-egui/src/app.rs
  find: 'let\s*\(\s*rect\s*,\s*resp\s*\)\s*=\s*ui\.allocate_exact_size\(\s*vec2\(\s*width\s*,\s*ROW_HEIGHT\s*\)[^;]*;'
  after: "\n        #[cfg(target_arch = \"wasm32\")] live::row(&node.path, rect, ui.clip_rect());"
# The Draw tab's Undo stroke: in a session it goes to the session too (it would take back whoever drew last).
- live: true
  file: crates/ui-egui/src/app.rs
  find: '\bfn\s+ink_undo\s*\(\s*&mut\s+self\s*\)\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if live::undo(false) { return; }"
# The stroke being drawn, which the presence carries so the others see it as it goes.
- live: true
  file: crates/ui-egui/src/inkpad.rs
  find: '\bdrawing_now(\s*:\s*Option<Stroke>\s*,)'
  replace: 'pub(crate) drawing_now$1'
# The web entry (apps/notecraft-web/src/main.rs, from web.diff): its live module, the runner kept for the adapter,
# and the app eframe runs wrapped (live::wrap: the window's frame, then the session's). If that file changes: the
# runner is the one `start` creates, and `wrap` takes the `Web` the creator returns.
- live: true
  file: apps/notecraft-web/src/main.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session.\n#[cfg(target_arch = \"wasm32\")]\nmod live;\n"
- live: true
  file: apps/notecraft-web/src/main.rs
  find: 'eframe::WebRunner::new\(\)'
  replace: 'crate::live::runner()'
- live: true
  file: apps/notecraft-web/src/main.rs
  find: 'Ok\(Box::new\((Web\s*\{[^}]*\})\)\)'
  replace: 'Ok(crate::live::wrap($1))'
