# Rules 18-70/92: the modules that use the clock, files or threads (Instant::now, SystemTime::now, std::fs,
# thread::scope / sleep, process::id) take `std` from crates/playground on wasm through ONE `use` line at their end
# (see the top). Found with: every non-test module of the crates the web build compiles that names Instant,
# SystemTime, fs::, File::, OpenOptions or thread::scope/sleep (crates/ipc's mmap'd regions and the recording thread's
# writer stay out: they hand std's File to crates that take that one, and never run here). If upstream starts using
# these in another module, give it the same line; a missing one panics at the first clock or file call.
- file: crates/als/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the clock, files and threads (patches/ableton-live.yaml).\n#[cfg(target_arch = \"wasm32\")] use suhina_playground::std;\n"
- file: crates/device-sdk/src/lib.rs
