# Rules 78-82/92: Ogg Vorbis and MP3 export. Their encoders are C code with no browser side (libvorbis through vorbis_rs,
# whose errno crate doesn't build for wasm32-unknown-unknown; LAME, which has no libc headers there). Rules 78-79 move
# vorbis_rs into a table for native targets; rule 80 gives the browser an Ogg writer that says so; rule 81 skips compiling
# LAME on wasm and rule 82 gives the browser an MP3 writer that says so, so nothing refers to the C code (WAV and FLAC
# export work as before). If upstream drops these exports or swaps the encoders for pure-Rust ones, drop the rules.
- file: crates/media/Cargo.toml
  find: '^vorbis_rs = [^\n]*\n'
  replace: ''
- file: crates/media/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(not(target_arch = \"wasm32\"))'.dependencies]\nvorbis_rs = { version = \"0.5\", default-features = false }\n"
- file: crates/media/src/write.rs
  find: '^fn write_ogg\('
  replace: "#[cfg(target_arch = \"wasm32\")]\nfn write_ogg(_path: &Path, _samples: &[f32], _spec: &AudioFileSpec) -> Result<(), String> {\n    Err(\"Ogg Vorbis export is not available in the browser (it needs libvorbis, C code): choose WAV or FLAC.\".into())\n}\n#[cfg(not(target_arch = \"wasm32\"))]\nfn write_ogg("
- file: crates/mp3/build.rs
  find: '^fn main\(\) \{'
  after: "\n    // Playground's browser build: no C compiler for wasm here (patches/ableton-live.yaml).\n    if std::env::var(\"CARGO_CFG_TARGET_ARCH\").as_deref() == Ok(\"wasm32\") {\n        return;\n    }"
- file: crates/media/src/write.rs
  find: '^fn write_mp3\('
  replace: "#[cfg(target_arch = \"wasm32\")]\nfn write_mp3(_path: &Path, _samples: &[f32], _spec: &AudioFileSpec) -> Result<(), String> {\n    Err(\"MP3 export is not available in the browser (its encoder is C code): choose WAV or FLAC.\".into())\n}\n#[cfg(not(target_arch = \"wasm32\"))]\nfn write_mp3("

# Live editing in Playground sessions (patches/ableton-live/live.diff + the playground-live crate, tools.yaml live_kit)
# What it's for: people in a Playground session work on the same project at once: clips and their notes, audio clip
#   settings, scenes, tracks, the arrangement, the mixer (volume, pan, sends), devices and their parameters and the
#   tempo reach the others as they are made; two people's edits to different clips, or different notes of one clip,
#   both stay; objects both add under the same id are renumbered, not refused; each person's Ctrl+Z takes back only
#   their own edits; samples travel as the session's media, so joining from a link needs no files. Each sees the
#   others' pointers with name tags in the Session view, the Arrangement and the clip editor, and their gestures as
#   they happen: notes being moved, resized or drawn, clips being moved or trimmed, volume faders and device knobs
#   being turned. Playing is personal: what one person launches plays on their own machine (transport and launches
#   are not part of the project).
# How: the adapter lives in new files: crates/session/src/live.rs (the shared document: the project file's JSON, with
#   ids for lists that have none, a note's being the note itself; the merge; putting a document back into the session;
#   media; it re-exports the playground-live crate, patches/live/kit, as `kit`), crates/ui/src/app/live.rs (the window
#   as the kit's app: which project is shared, quiet frames, media) with live/peers.rs (presence, drawn with the kit's
#   look), and apps/suhina-web/src/live.rs (the kept runner, the app wrapped with the session's frame). These rules
#   only declare them and call in, one line each.
# Verify: node scripts/build.mjs check ableton-live head (and LIVE=0), the e2e (tests/live-apps/ableton-live.mjs) and
#   `cargo test -p suhina-session --lib live`.
# If upstream changes: when a line named below changes, anchor on its new spelling; if Session or App rename the fields
#   live.rs uses (project, changes, open_step, param_gesture, audio, audio_changed, audio_folder, undo, redo; projects,
#   shown, view.drag), follow them there.
#
# The playground-live crate (the session, and the presence look the others are drawn with) as a dependency of the
# session crate, whose `live` re-exports it, and of crates/ui with its look (`egui`).
- live: true
  file: crates/session/Cargo.toml
  find: '^\[dependencies\]\n'
  after: "playground-live = { path = \"../../playground-live\" }\n"
- live: true
  file: crates/ui/Cargo.toml
  find: '^\[dependencies\]\n'
  after: "playground-live = { path = \"../../playground-live\", features = [\"egui\"] }\n"
- live: true
  file: crates/session/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only, and its native tests).\n#[cfg(any(target_arch = \"wasm32\", test))]\npub mod live;\n"
- live: true
  file: crates/session/src/lib.rs
  find: '\bpub\s+fn\s+can_undo\s*\(\s*&self\s*\)\s*->\s*bool\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if live::kit::connected() { return true; }"
- live: true
  file: crates/session/src/lib.rs
  find: '\bpub\s+fn\s+can_redo\s*\(\s*&self\s*\)\s*->\s*bool\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if live::kit::connected() { return true; }"
- live: true
  file: crates/session/src/lib.rs
  find: '\bfn\s+undo\s*\(\s*&mut\s+self\s*\)\s*->\s*bool\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if live::kit::undo(false) { return true; }"
- live: true
  file: crates/session/src/lib.rs
  find: '\bfn\s+redo\s*\(\s*&mut\s+self\s*\)\s*->\s*bool\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if live::kit::undo(true) { return true; }"
- live: true
  file: crates/ui/src/app.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only).\n#[cfg(target_arch = \"wasm32\")]\npub mod live;\n"
- live: true
  file: crates/ui/src/session/session_view.rs
  find: 'draw_column\(ui,\s*&painter,\s*&bands,\s*clip,\s*span,\s*column,\s*track_number,\s*progress,\s*state,\s*actions\);'
  after: "\n        #[cfg(target_arch = \"wasm32\")] crate::app::live::column(column.track, span, bands.top, slot_pitch(), bands.body, bands.mixer);"
- live: true
  file: crates/ui/src/arrangement/arrangement_view.rs
  find: 'let\s+lane_at\s*=\s*\|pos:\s*Pos2\|[^;]*;'
  after: "\n    #[cfg(target_arch = \"wasm32\")] crate::app::live::lanes(rows.iter().map(|r| (r.track, r.time, r.clip)), time.left() - scroll_x, beat_width);"
- live: true
  file: crates/ui/src/arrangement/arrangement_view/clip.rs
  find: '\bfn\s+paint_clip\s*\([\s\S]*?\)\s*\{'
  after: "\n    #[cfg(target_arch = \"wasm32\")] crate::app::live::clip_shown(clip.id, rect);"
- live: true
  file: crates/ui/src/detail/piano_roll/drawing.rs
  find: 'let\s+note\s*=\s*shown\(i,\s*note\);'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if preview.is_some() && state.selected.contains(&i) { crate::app::live::moving_note(&note); }"
- live: true
  file: crates/ui/src/detail/piano_roll/drawing.rs
  find: 'for\s+note\s+in\s+&drawn\s*\{'
  before: "#[cfg(target_arch = \"wasm32\")] crate::app::live::drawn_notes(&drawn);\n    "
- live: true
  file: crates/ui/src/detail/piano_roll.rs
  find: 'draw\(ui,\s*&layout,\s*clip,\s*state,\s*grid,\s*preview,\s*shape\.played\(\)\);'
  after: "\n    #[cfg(target_arch = \"wasm32\")] crate::app::live::piano(ui, &clip.address, layout.grid, layout.key_height, &|b| layout.x_of(b), &|x| layout.beat_at(x), &|k| layout.y_of(k), &|y| layout.key_at(y));"
- live: true
  file: crates/ui/src/session/mixer_strip.rs
  find: 'let\s+db\s*=\s*volume_drag\(ui,\s*&response,\s*column,\s*state,\s*actions\);\s*paint_fader\(ui,\s*painter,\s*readout,\s*fader,\s*db,\s*&response(?:,\s*[^;]*?)?\);'
  after: "\n    #[cfg(target_arch = \"wasm32\")] crate::app::live::fader(painter, column.track, fader);"
- live: true
  file: crates/ui/src/session/mixer_strip.rs
  find: 'widgets::knob\(\s*painter,\s*Pos2::new\(row\.left\(\)\s*\+\s*size\s*/\s*2\.0,\s*row\.center\(\)\.y\),'
  before: "#[cfg(target_arch = \"wasm32\")] crate::app::live::pan(painter, column.track, Rect::from_min_size(Pos2::new(row.left(), row.center().y - size / 2.0), egui::Vec2::splat(size)));\n        "
- live: true
  file: crates/ui/src/detail/detail_view/parameters.rs
  find: 'if\s+let\s+Some\(response\)\s*=\s*response\.filter\(\|r\|\s*r\.changed\(\)\s*\|\|\s*r\.drag_stopped\(\)\)\s*\{'
  before: "#[cfg(target_arch = \"wasm32\")] crate::app::live::param(painter, track, &at.value(), &parameter.id, slider_rect, value, parameter.min, parameter.max, response.as_ref().is_some_and(|r| r.dragged()));\n    "
- live: true
  file: apps/suhina-web/src/main.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session.\n#[cfg(target_arch = \"wasm32\")]\nmod live;\n"
- live: true
  file: apps/suhina-web/src/web.rs
  find: 'eframe::WebRunner::new\(\)'
  replace: 'crate::live::runner()'
- live: true
  file: apps/suhina-web/src/web.rs
  find: 'Ok\(Box::new\((Web::new\(cc\))\)\)'
  replace: 'Ok(crate::live::wrap($1))'
