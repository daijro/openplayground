# Suhina in the browser. Upstream (github.com/suhina-daw/suhina-daw) ships desktop nightlies only; these patches add
# the web build Playground serves, from its head commit.
#
# patches/ableton-live/web.diff adds new files only:
#   apps/suhina-web/           the web crate build.mjs finds (Cargo.toml, Trunk.toml, index.html, src/): the desktop
#                              window (crates/ui) on the page's canvas, with the desktop app's (apps/suhina) part
#                              ported: the demo project at start, settings and keys in localStorage, File > Open
#                              through Playground's Open dialog, "Open in Suhina" (a project with the files beside it,
#                              or a sample or MIDI file as a clip on a new track), everything Suhina writes (a save, a
#                              render) kept in Files at its path, dropped files, and the browser's audio (src/audio.rs:
#                              the engine renders in the page's WebAudio callback through cpal's webaudio host; the
#                              desktop output renders ahead on a real-time thread a page cannot start).
#   crates/playground/         what wasm32-unknown-unknown lacks, for the library's crates: `std` with web-time's clock,
#                              an in-memory file system, `thread::scope` running its spawns in place and a no-op
#                              `thread::sleep`, and `interprocess`, a never-connecting stand-in for the plug-in hosts'
#                              sockets. The modules that use the clock, files or threads take `std` from it on wasm
#                              through ONE `use` line at their end (a local `std` shadows the standard library's name
#                              in that module; everything else in it still comes from the real std).
# Gated off on the web: the plug-in hosts (CLAP/VST3 run out of process), the agents' endpoints and the CLI
# (crates/automation, apps/suhina-cli: not compiled), updates (never asked), audio recording and MIDI inputs (no
# threads), the browser panel's folder index and the sample map (never started). Native builds see none of this:
# every rule adds wasm-only lines, or a wasm-only early return.

# Rule 1/92: the web build's own profile (apps/suhina-web/index.html names it): release with whole-program
# optimisation, as NoteCraft's and the ArtCraft web profiles have. A table of its own, so upstream's [profile.release]
# stays as it is. If upstream adds a profile of this name, rename it here and in index.html.
- file: Cargo.toml
  find: '(?![\s\S])'
  after: "\n# Playground's web build (patches/ableton-live.yaml): release with whole-program optimisation.\n[profile.playground-web]\ninherits = \"release\"\nlto = \"fat\"\ncodegen-units = 1\n"

# Rules 2-3/92: the plug-in hosts' sockets. `interprocess` has no wasm side: on wasm crates/plugins takes the
# never-connecting stand-in crates/playground has under that name (starting a plug-in host fails with a message, and
# the project plays without it). The first rule moves the crate's line into a native-only table at the end; if
# upstream drops or renames the dependency, drop both rules.
- file: crates/plugins/Cargo.toml
  find: '^(interprocess\s*=[^\n]*)\n([\s\S]*)$'
  replace: "$2\n[target.'cfg(not(target_arch = \"wasm32\"))'.dependencies]\n$1\n\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nsuhina-playground = { path = \"../playground\" }\n"
- file: crates/plugins/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: no plug-in hosts there (patches/ableton-live.yaml).\n#[cfg(target_arch = \"wasm32\")] use suhina_playground::interprocess;\n"

# Rules 4-17/92: crates/playground as a wasm-only dependency of each crate whose modules take its std (crates/plugins
# has it from the rules above), under a target spelling nobody else uses (`all(...)`), so it never meets a table of
# upstream's. A crate upstream adds that needs the clock or files gets one more such rule.
- file: crates/als/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nsuhina-playground = { path = \"../playground\" }\n"
- file: crates/device-sdk/Cargo.toml
