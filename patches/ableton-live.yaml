# Rules 71-72/92: backups name their times through chrono, which takes std's SystemTime: those two functions get it
# from the page's (no backups are written in the browser, but backup.rs's clock must be the page's: every Session
# makes a backup state at once). If upstream renames them, follow.
- file: crates/session/src/backup.rs
  find: '\bfn\s+date_time\s*\(\s*written\s*:\s*SystemTime\s*\)\s*->\s*String\s*\{'
  after: "\n    #[cfg(target_arch = \"wasm32\")] let written = suhina_playground::std_time(written);"
- file: crates/session/src/backup.rs
  find: '\bfn\s+clock_time\s*\(\s*written\s*:\s*SystemTime\s*\)\s*->\s*String\s*\{'
  after: "\n    #[cfg(target_arch = \"wasm32\")] let written = suhina_playground::std_time(written);"

# Rules 73-77/92: files in memory where a call asks the real file system (Path::is_file, canonicalize): the project's
# audio is found (`locate`, inside the project's folder, no links, answered by crates/playground) and decoded,
# samples and Stems files added to a project are found, and a decoded file still in its place is not offered as
# missing. If upstream changes: follow `locate`'s signature; anchor the others on the new spelling of the check.
- file: crates/media/src/lib.rs
  find: '\bpub\s+fn\s+locate\s*\(\s*file\s*:\s*&str\s*,\s*absolute\s*:\s*Option<&str>\s*,\s*project_dir\s*:\s*&Path\s*[,)][^{]*\{'
  after: "\n    #[cfg(target_arch = \"wasm32\")] return suhina_playground::locate(file, absolute, project_dir);"
- file: crates/media/src/lib.rs
  find: '\.find\(\|p\|\s*p\.is_file\(\)\)'
  replace: '.find(|p| std::fs::metadata(p).is_ok_and(|m| m.is_file()))'
- file: crates/session/src/files.rs
  find: 'if\s+!absolute\.is_file\(\)'
  replace: 'if !std::fs::metadata(&absolute).is_ok_and(|m| m.is_file())'
- file: crates/session/src/files.rs
  find: 'if\s+!absolute\.is_file\(\)'
  replace: 'if !std::fs::metadata(&absolute).is_ok_and(|m| m.is_file())'
- file: crates/session/src/relink.rs
  find: '!loaded\s*\|\|\s*!missing\.last_path\.is_file\(\)'
  replace: '!loaded || !std::fs::metadata(&missing.last_path).is_ok_and(|m| m.is_file())'

