# Follow the browser's light/dark preference at startup (Dark in dark mode, Light otherwise), through
# the app's ui.dark command (File > Options > Dark mode).
# Runs just before the app is handed to eframe, whatever built it, re-binding it as mutable.
- file: apps/*-web/src/**/*.rs
  find: 'Ok\(Box::new\(\w*Shell\b'
  before: |
    let mut app = app;
    let dark = web_sys::window().and_then(|w| w.match_media("(prefers-color-scheme: dark)").ok().flatten()).is_some_and(|m| m.matches());
    let _ = app.run("ui.dark", serde_json::json!({"value": dark}));


# ══ Browser storage ══════════════════════════════════════════════════════════════════════════════════════
# Rules 1–9 connect WordCraft's browser build to openplayground's file storage. The site's shell
# (shell/files.js in github.com/daijro/openplayground) gives every app page `globalThis.playgroundFiles`:
#   open({types}) → [{path, name, bytes}] | null          saveAs({name, types, bytes}) → {path} | {download:true} | null
#   write(path, bytes)    read(path) → Promise<bytes>      onOpen(callback)      setUnsaved(bool)
# Its files have paths like `browser:/Reports/memo.docx`. What the user gets in Word:
#   - Save As, and Save on a document that isn't in browser storage yet, ask "Keep in browser storage /
#     Download to device", then where; the document then lives at that path (title, "Saved" state).
#   - Save on a browser-storage document writes back to it silently; AutoSave (on by default, as on the
#     desktop) does the same a moment after each edit.
#   - Open and Insert Picture open the site's file explorer (with "From computer…").
#   - Recent documents in browser storage reopen; the shell's ?open=browser:/… opens one at startup.
# The bridge itself (rule 7) is a file per channel, because the release hands files to the app through an
# `inbox` in Services and the newest commits through the framework's file intake: patches/word/browser.release.diff
# and browser.head.diff, each with the bridge (apps/wordcraft-web/src/web/playground.rs) and the one edit that only
# its channel needs. Both give the bridge the same entry points: install(app, ctx) → app, pump(app), report_unsaved.
# If WordCraft gains its own browser-storage saving, compare it with this list and delete the rules whose
# job it now does (the bridge last, once nothing calls it) rather than forcing them to match.

# Rule 1/9: the hooks the bridge (rule 7) fills in, on the host Services struct.
# What it's for: Save As in the browser has to ask asynchronously (the dialog is a web page), Recent has
#   to open browser-storage files asynchronously, and (newest commits, which have no open_async) Open and
#   Insert Picture ask the site's file explorer; Services only had synchronous pickers.
# How: save_as_async(suggested name, docx bytes) shows the dialog; a "Keep" answer comes back as
#   `file.save {path}` (rule 2 handles it). open_path_async(path) reads the file and opens it.
#   playground_open(purpose) opens the explorer (rule 10); the release's own open_async does that there.
# Verify: rules 2, 5 and 10 compile and use them.
# If upstream changes: put them on whatever struct carries the web services (the host's Services).
- file: crates/ui-egui/src/**/*.rs
  find: 'pub struct Services \{'
  replace: |-
    $&
        /// playground (patches/word.yaml): ask where to save: the suggested name and the docx bytes (for a
        /// download). A "Keep" answer comes back as `file.save {path: "browser:/…"}` (control channel or pump).
        pub save_as_async: Option<Box<dyn Fn(&str, Vec<u8>)>>,
        /// playground: reopen a browser-storage document by its `browser:` path; it arrives like an opened file.
        pub open_path_async: Option<Box<dyn Fn(&str)>>,
        /// playground: Open / Insert Picture through the site's file explorer, by purpose ("document", "picture").
        pub playground_open: Option<Box<dyn Fn(&str)>>,

# Rule 2/9: Save and Save As in the browser build.
# What it's for: Save on a `browser:` document writes it back silently; anything else (Save on a new or
#   uploaded document, Save As) asks Keep / Download instead of downloading straight away.
# How: runs in WordApp::run before its web branch ("Web: saving and exporting become downloads"). A
#   `browser:` path goes to the engine's own `file.save {path}`, which serializes, writes through
#   io::save_path → WEB_WRITE (rule 3), and sets the document's path and saved state; AutoSave may then
#   keep writing it. Otherwise save_as_async (rule 1) gets the name and docx bytes. Save As from the UI
#   (save_as_dialog: the picker returns the bare name on the web, then `file.save {path: name}`) lands here
#   too. Exports stay plain downloads on purpose: `file.saveAs` with a non-browser path (File > Export /
#   Print call it with "<name>.pdf|odt|html…") and file.exportPdf/exportPng fall through to the download
#   branch (which must not mark the document saved: see rule 8).
# Verify: new document → type → Ctrl+S → the Keep/Download dialog; Keep → name → Save; type, Ctrl+S → no
#   dialog, and the file's time in Files changes. File → Export → PDF downloads a .pdf with no dialog.
# If upstream changes: anchor on whatever handles file.save / file.saveAs in the web build before it
#   downloads (the release tests `services.download`, newer commits `browser_saves()`).
- file: crates/ui-egui/src/**/*.rs
  find: 'if (?:self\.services\.download\.is_some\(\)|self\.browser_saves\(\)) && matches!\(id, "file\.save"'
  before: |
    // playground (patches/word.yaml): Save / Save As against browser storage, before the download branch.
            if let Some(ask) = &self.services.save_as_async
                && (id == "file.save"
                    || (id == "file.saveAs" && params.get("path").and_then(Value::as_str).is_none_or(|p| p.starts_with("browser:"))))
            {
                let path = params.get("path").and_then(Value::as_str).map(str::to_string).or_else(|| {
                    if id == "file.save" { self.session.path.as_ref().map(|p| p.to_string_lossy().to_string()) } else { None }
                });
                if let Some(path) = path.filter(|p| p.starts_with("browser:")) {
                    let r = self.session.run("file.save", &json!({"path": path})).map_err(|e| e.to_string());
                    self.after_command("file.save");
                    if let Err(e) = &r {
                        self.status(e.clone());
                    } else {
                        // The stored file is this document's own: AutoSave may keep writing it.
                        self.autosave_path = self.session.path.clone();
                    }
                    return r;
                }
                let name = format!("{}.docx", self.title_stem());
                let bytes = wordcraft_engine::io::save_bytes(&name, &self.session.doc)?;
                ask(&name, bytes);
                return Ok(json!({"asked": true}));
            }


# Rule 3/9: where the engine writes `browser:` paths in the browser build.
# What it's for: the engine's save (Save, AutoSave) ends in io::save_path, which in the browser build was an
#   error stub. Now a `browser:` path's bytes go to playgroundFiles.write; other paths still error.
# How: WEB_WRITE is a fn pointer the bridge (rule 7) sets; the engine crate needs no new dependency.
# Verify: rule 2's silent Save and AutoSave change the stored file.
# If upstream changes: put the hook wherever the wasm build's "write document bytes to a path" lives. The
#   stub's parameters after the document (password, export options) vary by version and aren't used here.
- file: crates/engine/src/io.rs
  find: '(#\[cfg\(target_arch = "wasm32"\)\]\s*pub fn save_path(?:_with)?\(path: &std::path::Path, (\w+): &Document[^)]*\) -> Result<\(\), String> \{)'
  replace: |-
    /// playground (patches/word.yaml): where `browser:` paths are written in the browser build. The web
    /// crate's bridge sets it to openplayground's `playgroundFiles.write`; unset, saving errors as upstream.
    pub static WEB_WRITE: std::sync::OnceLock<fn(&str, &[u8]) -> Result<(), String>> = std::sync::OnceLock::new();

    $1
        if let Some(write) = WEB_WRITE.get()
            && path.to_string_lossy().starts_with("browser:")
        {
            let path = path.to_string_lossy();
            return write(&path, &save_bytes(&path, $2)?);
        }

# (A working browser clock for AutoSave used to be a rule here; upstream has one natively now: web_time.)

# Rule 5/9: Recent documents in browser storage reopen.
# What it's for: File → Recent lists `browser:` paths after saving there; clicking one ran `file.open
#   {path}`, which the browser build can't read synchronously.
# How: a `browser:` entry goes to open_path_async (rule 1), which reads it and opens it with its path, so it
#   stays bound to that file.
# Verify: save a document to browser storage, then within the same session (the Recent list isn't kept
#   across reloads on the web) File → Open: it's under Recent; clicking it opens it.
# If upstream changes: anchor on the Recent list's click handler: the open_recent function (named by its
#   signature, since its body calls file.open directly in releases and through open_file in newer commits);
#   a `browser:` path returns early, the rest runs as upstream.
- file: crates/ui-egui/src/**/*.rs
  find: 'fn open_recent\((\w+): &mut WordApp, (\w+): &str\) -> Result<\(\), String> \{'
  replace: |-
    $&
        // playground (patches/word.yaml): a browser-storage document reopens through the browser.
        if let (true, Some(open)) = ($2.starts_with("browser:"), &$1.services.open_path_async) {
            open($2);
            $1.ui.backstage = false;
            return Ok(());
        }

# Rule 6/9: switch it on at startup.
# What it's for: AutoSave back on (the desktop default; the browser build turned it off because it had
#   nowhere to write), the channel Save As answers come back on, and the bridge (rule 7) installed.
# How: just before the app is handed to eframe (the theme rule above inserts its block at the same anchor);
#   the bridge's install(app, ctx) returns the app.
# Verify: rules 2–5 work; without the shell (playgroundFiles missing) install() leaves the services alone
#   and the app behaves as upstream (rfd picker, downloads).
# If upstream changes: anchor on where web.rs hands the app to eframe.
- file: apps/*-web/src/**/*.rs
  find: 'Ok\(Box::new\(\w*Shell\b'
  before: |
    // playground (patches/word.yaml): browser storage.
                        let app = playground::install(app, &cc.egui_ctx);


# Rule 7/9: the bridge between the app's web services and `playgroundFiles`.
# What it's for: everything above; this is the only code that talks to the page.
# How: web/playground.rs (patches/word/browser.<channel>.diff) is the bridge: install() fills the Services
#   hooks (rule 1), WEB_WRITE (rule 3) and registers onOpen (?open= and Files' "Open in Word"); Save As
#   answers become `file.save {path}` runs (rule 2). Without playgroundFiles it changes nothing. This rule
#   only declares the module.
# Verify: the browser-storage flows above.
# If upstream changes: the bridge is self-contained in its file; adjust the names it uses (Services fields,
#   the file intake / inbox, DOC_EXTS/IMAGE_EXTS) in the channel's diff.
- file: apps/*-web/src/web.rs
  find: '$(?![\s\S])'
  before: |

    // playground (patches/word.yaml): the browser-storage bridge (patches/word/browser.<channel>.diff).
    mod playground;

# Rule 8/9: exporting or printing doesn't mark a stored document saved; AutoSave is not blocked.
# What it's for: upstream's download branch marks lossless exports (including ODT) saved, but those are
#   copies of the stored document in Playground (rule 2 lets them through). That cleared the unsaved state, so
#   AutoSave skipped the edits, the leave warning (rule A) stayed silent and the title lost its dot. And
#   upstream says AutoSave "isn't available in the browser" (autosave_block), which the stored files lift.
# How: guard both conditions. With save_as_async set (the shell is present) the download branch leaves
#   `dirty` alone and autosave_block doesn't report the browser. Without the shell, upstream behavior stays.
# Verify: open a stored document, type, File → Export → ODT: the title keeps its dot, and Ctrl+S (or
#   AutoSave) still writes the edit to the stored file; File → Options shows AutoSave enabled.
# If upstream changes: anchor on whatever clears dirty after a download / returns AutoSaveBlock::Browser;
#   delete once exports no longer do.
- file: crates/ui-egui/src/**/*.rs
  find: '(if (?:marked_saved|matches!\(id, "file\.save" \| "file\.saveAs"\) && keeps_everything\(&name\))) \{'
  replace: '$1 && self.services.save_as_async.is_none() {'
- file: crates/ui-egui/src/**/*.rs
  find: '(if (?:self\.services\.download\.is_some\(\)|self\.browser_saves\(\))) \{(\s*return Some\(AutoSaveBlock::Browser\);)'
  replace: '$1 && self.services.save_as_async.is_none() {$2'

# Rule 9/9: opening the document that's already open keeps its unsaved edits.
# What it's for: Ctrl+O and picking the open stored file, Files > "Open in Word", or its Recent entry ran
#   file.open again and replaced the edited document with the stored copy. (Excel and PowerPoint switch to
#   the open document instead; see their patches.)
# How: a delivered `browser:` file whose path is the current document's is skipped and just closes the
#   Backstage, so the document on screen stays as it is. It sits where the channel's files arrive
#   (drain_inbox in the release, open_dropped_file in newer commits): patches/word/browser.<channel>.diff.
# Verify: open a stored document, type, Ctrl+O, open the same file: the typing is still there.
# If upstream changes: re-fit the channel's diff; delete if opening an open path becomes a no-op.

# Rule 10: Open and Insert Picture ask the site's file explorer (newest commits).
# What it's for: the release has open_async for this; newer commits ask the framework's file service, which is
#   the browser's own chooser. The site's explorer (with "From computer…") shows the stored files.
# How: at the start of open_dialog and pick_picture, playground_open (rule 1) gets the purpose, if the bridge
#   set it, and the files arrive like opened ones. In the release the field is never set: its open_async runs.
# Verify: Ctrl+O and Insert > Picture show the site's explorer.
# If upstream changes: anchor on the functions that start those two pickers.
- file: crates/ui-egui/src/**/*.rs
  find: 'pub\(crate\) fn open_dialog\(&mut self\) \{'
  replace: |-
    $&
        if let Some(f) = &self.services.playground_open {
            f("document");
            return;
        }
- file: crates/ui-egui/src/**/*.rs
  find: 'pub\(crate\) fn pick_picture\(&mut self\) \{'
  replace: |-
    $&
        if let Some(f) = &self.services.playground_open {
            f("picture");
            return;
        }

# Rule A: tell the page whether there are unsaved changes, for the "Leave site?" warning.
# What it's for: closing the tab or leaving the app warns exactly when there's something unsaved (instead of
#   the shell's guess from recent typing/clicking).
# How: after the app's per-frame logic, report the session's dirty flag through playgroundFiles.setUnsaved; the
#   bridge only calls into the page when the value changes. pump() lets the bridge hand the app what the page
#   answered (Save As) from this frame; the release has nothing to do there.
# Verify: open a document, type, close the tab -> the browser asks; save (Ctrl+S), close -> it doesn't.
# If upstream changes: anchor on WebShell's per-frame logic; if the app sets its own beforeunload, delete this.
- file: apps/*-web/src/web.rs
  find: 'self\.app\.logic\(ctx\);'
  replace: |-
    $&
            playground::pump(&mut self.app);
            playground::report_unsaved(self.app.session.dirty);


# Live editing in Playground sessions (patches/word/live.diff + the playground-live crate, tools.yaml `live_kit`)
# What it's for: people in a Playground session edit the open document together and see each other's pointer, selection
#   and caret, and gestures under way before they reach the document (a picture's, shape's or text box's frame moved,
#   resized or turned, a table border dragged, ink being drawn), in each person's color.
# The adapter lives in new files: apps/wordcraft-web/src/live.rs (the shared document, adopt, Undo and presence, on its
# Peer around the app, as the playground-live crate's Live trait can't go on WordApp here; live/text_merge.rs merges
# text character by character, live/presence.rs shares and draws the others: pointers, name tags, ghosts, outlines and
# easing the kit's, text shading, carets, border lines and strokes WordCraft's own) and
# apps/wordcraft-web/src/web/live.rs (the kept runner, and the shell that ends each frame with the session's frame
# hook, which draws the others over the pages); crates/ui-egui/src/{objects,ink,table_resize}/live.rs read the canvas's
# drags. Two small parts differ by channel, each a diff of new files only: live-drags.<channel>.diff (the drags read in
# objects/live.rs and table_resize/live.rs; on the newest commits only a page-tool move shows, as the frame's handles are
# the framework's) and live-view.<channel>.diff (apps/wordcraft-web/src/live/view.rs, where the canvas puts the pages:
# fields in the release, methods since). These rules only declare them and call in, one line each at the end of a file or after a function's signature,
# the same on both channels. Verify: node scripts/build.mjs check word head|release, then the e2e
# (tests/live-apps/word.mjs) and `cargo test -p wordcraft-web live::`. If upstream renames a function named below,
# anchor on its new signature; if it renames WebShell or its `app` field, follow it in web/live.rs; if it renames a
# drag's fields, follow them in its live.rs.
#
# The adapter's module (web, and native tests), and its dependency there: the playground-live crate (patches/live/kit:
# the session and the presence look, `egui`).
- live: true
  file: apps/wordcraft-web/src/main.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (the playground-live crate, patches/live/kit).\n#[cfg(any(target_arch = \"wasm32\", test))]\nmod live;\n"
- live: true
  file: apps/wordcraft-web/Cargo.toml
  find: '^\[dependencies\]\n'
  after: "playground-live = { path = \"../../playground-live\", features = [\"egui\"] }\n"
# The two hooks upstream calls through, set by live.rs: the session takes Undo and Redo of the shared document, and
# the QAT keeps them enabled while it does.
- live: true
  file: crates/engine/src/lib.rs
  find: '(?![\s\S])'
  after: "\n/// Live editing in a Playground session: runs first in Session::run (document id, command, params) and takes the command when it returns true.\npub static LIVE_UNDO: std::sync::OnceLock<fn(u64, &str, &serde_json::Value) -> bool> = std::sync::OnceLock::new();\n/// Live editing in a Playground session: whether the session holds a document's Undo and Redo (by document id).\npub static LIVE_HISTORY: std::sync::OnceLock<fn(u64) -> bool> = std::sync::OnceLock::new();\n"
# Session::run, which every Undo and Redo goes through (keys, menus, the QAT, Undo Actions): first, the session's.
- live: true
  file: crates/engine/src/**/*.rs
  find: 'pub\s+fn\s+run\s*\(\s*&mut\s+self\s*,\s*(\w+)\s*:\s*&str\s*,\s*(\w+)\s*:[^{]*\{'
  replace: "$&\n        if crate::LIVE_UNDO.get().is_some_and(|undo| undo(self.document_id(), $1, &$2)) { return Ok(Default::default()); }"
# qat_enabled, the Quick Access Toolbar's (and its keytips') enabled state: Undo and Redo while the session holds them.
- live: true
  file: crates/ui-egui/src/**/*.rs
  find: 'fn\s+qat_enabled\s*\((?:\s*\w+\s*:\s*&egui::Context\s*,)?\s*(\w+)\s*:\s*&WordApp\s*,\s*(\w+)\s*:\s*&str\s*\)\s*->\s*bool\s*\{'
  replace: "$&\n    if matches!($2, \"edit.undo\" | \"edit.redo\") && wordcraft_engine::LIVE_HISTORY.get().is_some_and(|live| live($1.session.document_id())) { return true; }"
# The web entry keeps its runner for the adapter and wraps its app (web/live.rs, a child module so it reaches
# WebShell's fields); the browser-storage rules above still insert before the same Ok(…WebShell…).
- live: true
  file: apps/wordcraft-web/src/web.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session.\nmod live;\n"
- live: true
  file: apps/wordcraft-web/src/web.rs
  find: 'eframe::WebRunner::new\(\)'
  replace: 'live::runner()'
- live: true
  file: apps/wordcraft-web/src/web.rs
  find: 'Ok\(Box::new\((?=\s*WebShell\b)'
  replace: 'Ok(live::wrap('
# The canvas's drags under way, read for the others where they are kept (each module a child, so it reaches its drag's
# private fields): an object's frame (objects.rs), an ink stroke (ink.rs), a table border (table_resize.rs).
- live: true
  file: crates/ui-egui/src/objects.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session: what a drag here is doing, for the others (objects/live.rs).\npub mod live;\n"
- live: true
  file: crates/ui-egui/src/ink.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session: what a drag here is doing, for the others (ink/live.rs).\npub mod live;\n"
- live: true
  file: crates/ui-egui/src/table_resize.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session: what a drag here is doing, for the others (table_resize/live.rs).\npub mod live;\n"
