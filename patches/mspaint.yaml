# PaintCraft (github.com/replicraft/PaintCraft) in the browser: its own browser editor, apps/paintcraft-web (the Classic
# presentation, MS Paint's look), built the way Playground builds apps. Upstream builds it with pnpm and Astro (a site
# with a download page); its releases are desktop packages only, so Playground builds its head commit.
#
# patches/mspaint/web.diff adds new files only:
#   apps/paintcraft-web/Trunk.toml, index.html   the editor alone, for trunk (build.mjs builds the web crate there):
#                            upstream's page and loader (src/pages/index.astro, src/lib/main.js) with the Japanese and
#                            Chinese faces the editor needs copied next to the page, in upstream's web-release profile.
#   apps/paintcraft-web/src/paintcraft-web/app/playground.rs   its files in Playground's Files
#                            (`globalThis.playgroundFiles`): Open is Files' Open dialog, Save writes the project back to
#                            its browser file or asks where (browser storage or a download), Export asks where, "Open in
#                            PaintCraft" and dropped files go through the app's Open (after its unsaved-changes
#                            question), the leave warning follows the app's unsaved state, and the greeting in the
#                            status bar says Save keeps a project copy in Files (upstream's says it downloads one).
# Native builds see none of this: every rule adds wasm-only lines. The browser clipboard (Copy, Paste), the theme
# following the browser's light/dark preference and the clock are upstream's already.

# Rule 1/6: upstream pins its toolchain (rust-toolchain.toml), which rustup installs without the wasm target: CI then
# fails with "can't find crate for `core`". The pin also asks for the target here.
# If upstream lists `targets` itself (or drops the pin), delete this rule.
- file: rust-toolchain.toml
  find: '^\[toolchain\]'
  after: "\ntargets = [\"wasm32-unknown-unknown\"]"

# Rules 2-3/6: the Files module (app/playground.rs), a child of the app module, run after each frame of the app's.
# If upstream renames the app's module list or its eframe::App::ui, anchor on the new spelling.
- file: apps/paintcraft-web/src/paintcraft-web/app.rs
  find: '^mod\s+documents\s*;'
  after: "\n// Playground's browser build: its files in Playground's Files (patches/mspaint.yaml).\n#[cfg(target_arch = \"wasm32\")]\npub(crate) mod playground;"
- file: apps/paintcraft-web/src/paintcraft-web/app.rs
  find: 'fn\s+ui\s*\(\s*&mut\s+self\s*,\s*ui\s*:\s*&mut\s+egui::Ui\s*,[^)]*\)\s*\{\s*self\.show\(ui\);'
  after: "\n        #[cfg(target_arch = \"wasm32\")]\n        playground::frame(self, ui.ctx());"

# Rules 4-5/6: Open asks Files (WebApp::replace, after the unsaved-changes question), and what Save and Export would
# download goes to Files (Files::download's one download call); without playgroundFiles both stay upstream's.
# Verify: Open lists the projects and pictures in Files; Save asks where once, then saves back silently. If upstream
# renames these calls, follow them.
- file: apps/paintcraft-web/src/paintcraft-web/app.rs
  find: '^([ \t]*)self\s*\.files\s*\.open\(\s*ctx,\s*frontend\b'
  replace: "$1#[cfg(target_arch = \"wasm32\")]\n$1if action == Action::Open && playground::open(self, frontend) {\n$1    return;\n$1}\n$&"
- file: apps/paintcraft-web/src/paintcraft-web/files.rs
  find: 'download_copy\(&bytes,\s*name,\s*mime\)'
  replace: 'crate::app::playground::save(&bytes, name, options.format.is_none().then_some((owner, document.state_id))).unwrap_or_else(|| download_copy(&bytes, name, mime))'

# decode_input is files.rs's private decoder (Open's); playground.rs reads handed-in files with it.
- file: apps/paintcraft-web/src/paintcraft-web/files.rs
  find: '^(?:#\[cfg\(test\)\]\s*)?(?:pub\(crate\)\s+)?fn\s+decode_input\b'
  replace: 'pub(crate) fn decode_input'

# Rule 6/6: the Classic ribbon's "Download for desktop" opens /download, upstream's site page, which this build doesn't
# have (Playground's own pages are at the site's root): it stays hidden on the web. If upstream renames the field, follow.
- file: apps/paintcraft-web/src/paintcraft-web/app.rs
  find: 'desktop_download:\s*'
  after: '!cfg!(target_arch = "wasm32") && '


# Live editing in Playground sessions (patches/mspaint/live.diff + the playground-live crate, tools.yaml `live_kit`)
# What it's for: people in a Playground session paint on the same picture at once: strokes, shapes, fills, text, crops
#   and the layers (added, removed, reordered, renamed, hidden) reach the others; edits to different layers or tiles
#   both stay and two strokes in one tile merge pixel by pixel (the later on top); each person's Ctrl+Z takes back
#   only their own; each sees the others' pointers with their names, the stroke, shape, marquee, lasso or text they
#   are making and their selection, in their colour, as it happens.
# How: the adapter lives in new files: apps/paintcraft-web/src/paintcraft-web/live.rs (the shared picture as JSON:
#   layers by id, each with its 256×256 tiles that differ from its default, LZ4 and base64; the tile merge; the app's
#   Live hooks), live/peers.rs (presence: pointers, tags, outlines, ghosts, dashes and easing the kit's, strokes drawn
#   there), live/tests.rs, and crates/editing/paintcraft-editor/src/session/live.rs (Session::install_remote: a merged
#   picture published with no history step, the selection kept). The playground-live crate (patches/live/kit, copied
#   to the checkout's playground-live/) gives the session, its JSON merge and the presence look. These rules only add
#   the dependencies, declare the modules and call in, one line each or an operand.
# Verify: node scripts/build.mjs check mspaint head (and LIVE=0), `cargo test -p paintcraft-web live::` and the e2e
#   (tests/live-apps/mspaint.mjs).
# If upstream changes: when a line named below changes, anchor on its new spelling; if WebApp renames the fields
#   live.rs and peers.rs use (editor, paste, zoom), the editor its session, tools or target, or the raster layer its
#   tile API (tile_versions, read_span, set_block), follow them there.
#
# The web crate's dependencies for the adapter, on every target (natively only its tests use them): the
# playground-live crate with its presence look (`egui`), serde_json, and the LZ4 codec upstream's formats use.
- live: true
  file: apps/paintcraft-web/Cargo.toml
  find: '^\[dependencies\]\n'
  after: "playground-live = { path = \"../../playground-live\", features = [\"egui\"] }\nserde_json = \"1\"\nlz4_flex.workspace = true\n"
# The adapter module (web only, and its native tests), offered to the page once the app runs.
- live: true
  file: apps/paintcraft-web/src/paintcraft-web/lib.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only, and its native tests).\n#[cfg(any(target_arch = \"wasm32\", test))]\nmod live;\n"
- live: true
  file: apps/paintcraft-web/src/paintcraft-web/lib.rs
  find: '(\b\w+)\s*\.\s*runner\s*\.start\(\s*canvas\b[^;]*?\.await'
  replace: '$&.inspect(|()| crate::live::attach(&$1.runner))'
# Session::install_remote (session/live.rs), a child of the session module so it reaches the published state.
- live: true
  file: crates/editing/paintcraft-editor/src/session.rs
  find: '^mod\s+residency\s*;'
  after: "\n// Live editing in a Playground session (web, and debug builds for the native tests).\n#[cfg(any(target_arch = \"wasm32\", debug_assertions))]\nmod live;"
# Each frame ends with the session's (after the canvas drew the others).
- live: true
  file: apps/paintcraft-web/src/paintcraft-web/app.rs
  find: 'fn\s+ui\s*\(\s*&mut\s+self\s*,\s*ui\s*:\s*&mut\s+egui::Ui\s*,[^)]*\)\s*\{\s*self\.show\(ui\);'
  after: "\n        #[cfg(target_arch = \"wasm32\")]\n        crate::live::frame(self, ui.ctx());"
# Undo and Redo (the ribbon's, the menu's, Ctrl+Z and Ctrl+Y all go through WebApp::action): in a session they go to
# the session, after the gesture or text draft under way is dropped as upstream's Undo drops it; they stay enabled.
- live: true
  file: apps/paintcraft-web/src/paintcraft-web/app.rs
  find: 'Action::Undo\s*=>\s*\{\s*self\.editor\.tools\.cancel_gesture\(\);'
  after: "\n                if playground_live::undo(false) {\n                    self.editor.cancel();\n                    return;\n                }"
- live: true
  file: apps/paintcraft-web/src/paintcraft-web/app.rs
  find: 'Action::Redo\s*=>\s*\{\s*self\.editor\.tools\.cancel_gesture\(\);'
  after: "\n                if playground_live::undo(true) {\n                    self.editor.cancel();\n                    return;\n                }"
- live: true
  file: apps/paintcraft-web/src/paintcraft-web/app.rs
  find: 'can_undo:\s*'
  after: 'playground_live::connected() || '
- live: true
  file: apps/paintcraft-web/src/paintcraft-web/app.rs
  find: 'can_redo:\s*'
  after: 'playground_live::connected() || '
# The canvas: after the picture, the selection and this person's previews, the others' marks (and this person's
# pointer noted), before the cursor.
- live: true
  file: apps/paintcraft-web/src/paintcraft-web/canvas.rs
  find: '^([ \t]*)if\s+response\.hovered\(\)\s*&&\s*!self\.blocked\(\)'
  replace: "$1#[cfg(target_arch = \"wasm32\")]\n$1crate::live::paint(self, ui, &painter, response.rect);\n$&"
