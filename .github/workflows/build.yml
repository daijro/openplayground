name: Build apps

# Builds each app from source (scripts/build.mjs: its patches and wasm-opt -O3) on both channels, its newest
# release and its newest commit, whenever one of those, its patches or the build recipe change: one parallel
# job per app and channel, publishing the zips to the `builds` release. fetch.yml then installs them; a
# failed build leaves that channel on its upstream release, or its last good build.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools.yaml, patches/**, scripts/build.mjs, scripts/diffs.mjs, scripts/releases.mjs, .github/workflows/build.yml]

concurrency:
  group: build

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - id: plan
        run: node scripts/build.mjs plan >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create the builds release
        run: gh release view builds >/dev/null 2>&1 || gh release create builds --title "App builds" --latest=false --notes "Patched, optimized web builds made by the Build apps workflow (scripts/build.mjs). The site installs them from here."
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: plan
    if: needs.plan.outputs.include != '[]'
    name: build (${{ matrix.slug }}, ${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      SLUG: ${{ matrix.slug }}
      CHANNEL: ${{ matrix.channel }}
      SRC: ${{ github.workspace }}/../build/${{ matrix.slug }}-${{ matrix.channel }}/src
      TITLE: "Build failing: ${{ matrix.slug }}${{ matrix.channel == 'head' && ' (latest commit)' || '' }}"
      BUILD_DIR: ${{ github.workspace }}/../build
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Free disk space for the Rust build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install trunk and binaryen
        run: |
          mkdir -p ~/tools/bin
          curl -sSfL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C ~/tools/bin
          url=$(gh api repos/WebAssembly/binaryen/releases/latest -q '.assets[] | select(.name | endswith("x86_64-linux.tar.gz")) | .browser_download_url')
          curl -sSfL "$url" | tar -xz -C ~/tools
          echo "$HOME/tools/bin" >> "$GITHUB_PATH"
          echo "WASM_OPT=$(ls ~/tools/binaryen-*/bin/wasm-opt)" >> "$GITHUB_ENV"

      - id: build
        name: Build
        continue-on-error: true
        shell: bash
        run: |
          node scripts/build.mjs facts "$SLUG" "$CHANNEL" >> "$GITHUB_OUTPUT"
          node scripts/build.mjs build "$SLUG" "$CHANNEL" 2>&1 | tee build.log

      # A failed build usually means upstream changed the code a patch rule edits. Claude (signed in with the
      # CLAUDE_CODE_OAUTH_TOKEN secret) rewrites this app's patch file until `check` passes on both channels,
      # since one patch file serves both; the rebuild below decides whether the fix is kept. It runs once a day
      # per app and channel (a broken branch would otherwise get an attempt per commit), and not on push
      # events, which the action doesn't support: the deploy job starts a run for those.
      - name: Check out both channels' upstream code for Claude
        if: steps.build.outcome == 'failure' && env.HAS_CLAUDE == 'true' && github.event_name != 'push' && steps.build.outputs.failed_today != 'true'
        continue-on-error: true
        run: for c in release head; do node scripts/build.mjs source "$SLUG" "$c"; done

      - id: repair
        name: Repair the patches with Claude
        if: steps.build.outcome == 'failure' && env.HAS_CLAUDE == 'true' && github.event_name != 'push' && steps.build.outputs.failed_today != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # The retry run after a failed push build is started by this workflow's own bot; the prompt is fixed.
          allowed_bots: github-actions
          settings: '{"env": {"BASH_DEFAULT_TIMEOUT_MS": "1800000", "BASH_MAX_TIMEOUT_MS": "1800000"}}'
          claude_args: >-
            --max-turns 120
            --add-dir ${{ github.workspace }}/../build
            --allowedTools "Read,Glob,Grep,Edit(patches/${{ matrix.slug }}.yaml),Write(patches/${{ matrix.slug }}.yaml),Edit(patches/${{ matrix.slug }}/**),Write(patches/${{ matrix.slug }}/**),Bash(node scripts/build.mjs check ${{ matrix.slug }} release:*),Bash(node scripts/build.mjs check ${{ matrix.slug }} head:*),Bash(tail:*),Bash(head:*),Bash(grep:*)"
          prompt: |
            The web build of the `${{ matrix.slug }}` app (see tools.yaml) on its `${{ matrix.channel }}` channel
            (release: its newest release; head: the newest commit on its branch) failed in scripts/build.mjs. Its
            log is build.log. The unpatched upstream code of each channel is checked out in
            ${{ github.workspace }}/../build/${{ matrix.slug }}-release/upstream and
            ${{ github.workspace }}/../build/${{ matrix.slug }}-head/upstream (a channel without a version has none).
            scripts/build.mjs explains the patch rule format.

            Usually upstream changed the code a rule in patches/${{ matrix.slug }}.yaml edits, so the rule no longer
            matches or the patched code no longer compiles. Update patches/${{ matrix.slug }}.yaml so every rule
            applies and keeps doing what its comment says (each rule's comment states what it is for, how it
            works, how to verify it, and what to do if upstream moves or replaces that code; if upstream now
            does a rule's job natively, delete the rule instead of forcing it to match), on BOTH channels: the same
            patch file builds the newest release and the newest commit, so a fix must not break the other one.
            Prefer anchors that survive future releases: the app's command names and type names rather than
            formatting or argument lists.

            The app may also have diffs in patches/${{ matrix.slug }}/ (scripts/build.mjs explains them; their
            header says what each is for). They apply first, and a diff that no longer applies fails the build
            ("no longer applies"). Most are pull requests sent upstream and not merged yet, applied here until
            they are. Re-fit such a diff to the channel's upstream code without changing what it does: its
            context and removed lines must match that code exactly (hunk line counts needn't). When the two
            channels need different versions, write `<name>.<channel>.diff` next to `<name>.diff`. If upstream
            has merged the pull request, or now does the same thing natively in that channel's code, write the
            diff (that channel's file) empty instead: an empty diff is skipped. So when only one channel has merged
            it, an empty `<name>.<channel>.diff` skips `<name>.diff` there and the other channel keeps applying it.

            Look at code with the Read, Grep and Glob tools; change the patches with Edit or Write. The only
            shell commands you can run are these two, as written or followed by `2>&1 | tail -n 60`:
            `node scripts/build.mjs check ${{ matrix.slug }} release` and
            `node scripts/build.mjs check ${{ matrix.slug }} head`. Each re-clones and re-applies the patches,
            then compiles (a channel without a version is skipped). Repeat until both pass. Only edit
            patches/${{ matrix.slug }}.yaml and the files in patches/${{ matrix.slug }}/. If the failure has
            nothing to do with the patches (a network error, or upstream code that doesn't build at all), change
            nothing and say so.

      - id: rebuild
        name: Rebuild with the repaired patches
        if: steps.repair.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.repair.outputs.execution_file }}
        run: |
          # Claude's last message and the tool calls it was refused (the action hides its full log).
          jq -r '.[] | select(.type == "result") | .result, (.permission_denials[]? | "Denied \(.tool_name): \(.tool_input | tostring)")' "$EXECUTION_FILE" || true
          # Delete the emptied diffs that no longer do anything, so this builds what gets committed.
          node scripts/build.mjs tidy "$SLUG"
          if [ -z "$(git status --porcelain -- "patches/$SLUG.yaml" "patches/$SLUG")" ]; then echo "Claude left the patches unchanged."; exit 1; fi
          git add -N "patches/$SLUG" 2>/dev/null || true
          git diff -- "patches/$SLUG.yaml" "patches/$SLUG"
          node scripts/build.mjs build "$SLUG" "$CHANNEL"
          node scripts/build.mjs check "$SLUG" "$([ "$CHANNEL" = head ] && echo release || echo head)"

      - name: Commit the repaired patches
        if: steps.rebuild.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A patches
          git commit -q -m "Repair $SLUG patches for ${{ steps.build.outputs.id }}" \
            -m "The $CHANNEL build failed with the old rules. Claude rewrote them in the Build apps workflow; the app rebuilt with the new ones, and its other channel still compiles."
          git pull -q --rebase && git push -q

      - name: Publish, deleting this channel's older builds
        if: steps.build.outcome == 'success' || steps.rebuild.outcome == 'success'
        run: |
          gh release upload builds out/*.zip --clobber
          gh release view builds --json assets -q '.assets[].name' | grep -E "^$SLUG-.*\.failed$" | grep -E "^$SLUG-head-" $([ "$CHANNEL" = head ] || echo -v) \
            | xargs -r -n1 gh release delete-asset builds -y
          node scripts/build.mjs prune "$SLUG" "$CHANNEL" | xargs -r -n1 gh release delete-asset builds -y
          # Builds again: close its build-failure issue.
          for n in $(gh issue list --label build-failure --state open --json number,title -q ".[] | select(.title == \"$TITLE\") | .number"); do
            gh issue close "$n" --comment "Builds again: $(basename out/*.zip .zip) in [this run]($RUN_URL)."
          done

      # A diff (patches/<slug>/) the newest release already has, so both channels do: build.mjs listed its files.
      - name: Delete diffs upstream has merged
        if: (steps.build.outcome == 'success' || steps.rebuild.outcome == 'success') && hashFiles(format('out/{0}.merged', matrix.slug)) != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs git rm -q --ignore-unmatch < "out/$SLUG.merged"
          git commit -q -m "Delete $SLUG diffs upstream has merged" -m "Its newest release, ${{ steps.build.outputs.id }}, already has them:" -m "$(cat "out/$SLUG.merged")"
          git pull -q --rebase && git push -q

      # The site keeps this channel's upstream release or last good build meanwhile. The marker stops retries
      # for a day, or until the version or the patches change. A failure while an earlier one is still on
      # record (retries come a day apart) has lasted over a day: open an issue for it, once.
      - name: Record the failure
        if: steps.build.outcome == 'failure' && steps.rebuild.outcome != 'success'
        env:
          ID: ${{ steps.build.outputs.id }}
          REPAIR: ${{ steps.repair.outcome }}
          FAILED_BEFORE: ${{ steps.build.outputs.failed_before }}
          FAILED_TODAY: ${{ steps.build.outputs.failed_today }}
        run: |
          if [ -n "$ID" ] && [ "${{ github.event_name }}" != push ]; then
            echo "Build failed; see the Build apps run log." > "$ID.failed"
            gh release upload builds "$ID.failed" --clobber
            open=$(gh issue list --label build-failure --state open --json title -q "[.[] | select(.title == \"$TITLE\")] | length")
            if [ "$FAILED_BEFORE" = true ] && [ "$open" -eq 0 ]; then
              gh label create build-failure --color D93F0B --description "An app has failed to build for over a day" 2>/dev/null || true
              case "$REPAIR" in
                success) repair="Claude tried to repair its patches, but the app still didn't build with them." ;;
                failure) repair="Claude's patch repair failed to run (see the run log)." ;;
                *) if [ "$FAILED_TODAY" = true ]; then repair="Claude already tried a repair in the last day."; else repair="Claude's patch repair didn't run (no CLAUDE_CODE_OAUTH_TOKEN secret)."; fi ;;
              esac
              [ "$CHANNEL" = head ] && which="newest commit" || which="newest release"
              [ "$CHANNEL" = head ] && meanwhile="its last good latest-commit build" || meanwhile="the app's upstream release"
              gh issue create --label build-failure --title "$TITLE" --body "$(printf '%s\n' \
                "The **$SLUG** build of its $which has failed for over a day. Meanwhile the site serves $meanwhile, so it keeps working." \
                "" \
                "- Failing build: \`$ID\`" \
                "- Latest attempt: [run]($RUN_URL)" \
                "- $repair" \
                "" \
                "Patch problems are repaired automatically, so the likely causes are upstream code that doesn't build at this version, which a later version may fix, or a build recipe that needs updating (\`scripts/build.mjs\`, \`.github/workflows/build.yml\`)." \
                "" \
                "The build is retried daily and as soon as a new version or patch lands. This issue closes itself when the app builds again.")"
            fi
          fi
          exit 1

  # Install whatever got built now, rather than at fetch.yml's next scheduled run. A push-triggered run
  # with failures also starts a run where Claude can repair them.
  deploy:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh workflow run fetch.yml -R ${{ github.repository }}
      - if: needs.build.result == 'failure' && github.event_name == 'push'
        run: gh workflow run build.yml -R ${{ github.repository }}
