name: Build apps

# Builds each app from source (scripts/build.mjs: its patches and wasm-opt -O3) whenever its upstream
# release, its patches or the build recipe change, one parallel job per app, and publishes the zips to
# the `builds` release. fetch.yml then installs them; a failed build leaves that app on its upstream release.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools.yaml, patches/**, scripts/build.mjs, scripts/releases.mjs, .github/workflows/build.yml]

concurrency:
  group: build

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.plan.outputs.slugs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - id: plan
        run: node scripts/build.mjs plan >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create the builds release
        run: gh release view builds >/dev/null 2>&1 || gh release create builds --title "App builds" --latest=false --notes "Patched, optimized web builds made by the Build apps workflow (scripts/build.mjs). The site installs them from here."
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: plan
    if: needs.plan.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    env:
      SLUG: ${{ matrix.slug }}
      BUILD_DIR: ${{ github.workspace }}/../build
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Free disk space for the Rust build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install trunk and binaryen
        run: |
          mkdir -p ~/tools/bin
          curl -sSfL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C ~/tools/bin
          url=$(gh api repos/WebAssembly/binaryen/releases/latest -q '.assets[] | select(.name | endswith("x86_64-linux.tar.gz")) | .browser_download_url')
          curl -sSfL "$url" | tar -xz -C ~/tools
          echo "$HOME/tools/bin" >> "$GITHUB_PATH"
          echo "WASM_OPT=$(ls ~/tools/binaryen-*/bin/wasm-opt)" >> "$GITHUB_ENV"

      - id: build
        name: Build
        continue-on-error: true
        shell: bash
        run: |
          echo "id=$(node scripts/build.mjs id "$SLUG")" >> "$GITHUB_OUTPUT"
          node scripts/build.mjs build "$SLUG" 2>&1 | tee build.log

      # A failed build usually means an upstream release changed the code a patch rule edits. Claude (signed
      # in with the CLAUDE_CODE_OAUTH_TOKEN secret) rewrites this app's patch file until `check` passes; the
      # full rebuild below decides whether the fix is kept. Claude's agent mode doesn't run on push events,
      # so those leave it to the run the deploy job starts.
      - id: repair
        name: Repair the patches with Claude
        if: steps.build.outcome == 'failure' && env.HAS_CLAUDE == 'true' && github.event_name != 'push'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # The retry run after a failed push build is started by this workflow's own bot; the prompt is fixed.
          allowed_bots: github-actions
          settings: '{"env": {"BASH_DEFAULT_TIMEOUT_MS": "1800000", "BASH_MAX_TIMEOUT_MS": "1800000"}}'
          claude_args: >-
            --max-turns 120
            --add-dir ${{ github.workspace }}/../build
            --allowedTools "Read,Glob,Grep,Edit(patches/${{ matrix.slug }}.yaml),Bash(node scripts/build.mjs check ${{ matrix.slug }})"
          prompt: |
            The web build of the `${{ matrix.slug }}` app (see tools.yaml) failed in scripts/build.mjs. Its
            log is build.log, and the upstream source it builds is checked out in
            ${{ github.workspace }}/../build/${{ matrix.slug }}/src, with the patch rules that matched already
            applied. scripts/build.mjs explains the patch rule format.

            Usually a new upstream release changed the code a rule in patches/${{ matrix.slug }}.yaml edits, so
            the rule no longer matches or the patched code no longer compiles. Update
            patches/${{ matrix.slug }}.yaml so every rule applies to the current upstream source and keeps doing
            what the comment at the top of the file says. Prefer anchors that survive future releases: the
            app's command names and type names rather than formatting or argument lists.

            Check your change with `node scripts/build.mjs check ${{ matrix.slug }}` (it re-clones and re-applies
            the patches, then compiles) and repeat until it passes. Only edit patches/${{ matrix.slug }}.yaml.
            If the failure has nothing to do with the patches (a network error, or upstream code that doesn't
            build at all), change nothing and say so.

      - id: rebuild
        name: Rebuild with the repaired patches
        if: steps.repair.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          if git diff --quiet "patches/$SLUG.yaml"; then echo "Claude left the patches unchanged."; exit 1; fi
          git diff "patches/$SLUG.yaml"
          node scripts/build.mjs build "$SLUG"

      - name: Commit the repaired patches
        if: steps.rebuild.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q "patches/$SLUG.yaml" -m "Repair $SLUG patches for ${{ steps.build.outputs.id }}" \
            -m "The build failed with the old rules. Claude rewrote them in the Build apps workflow, and the app rebuilt with the new ones."
          git pull -q --rebase && git push -q

      - name: Publish, keeping this app's 3 newest builds
        if: steps.build.outcome == 'success' || steps.rebuild.outcome == 'success'
        run: |
          gh release upload builds out/*.zip --clobber
          gh release view builds --json assets -q '.assets[].name' | grep -E "^$SLUG-.*\.failed$" | xargs -r -n1 gh release delete-asset builds -y
          gh release view builds --json assets -q "[.assets[] | select(.name | startswith(\"$SLUG-\") and endswith(\".zip\"))] | sort_by(.createdAt) | reverse | .[3:] | .[].name" \
            | xargs -r -n1 gh release delete-asset builds -y
          # Builds again: close its build-failure issue.
          for n in $(gh issue list --label build-failure --state open --json number,title -q ".[] | select(.title == \"Build failing: $SLUG\") | .number"); do
            gh issue close "$n" --comment "Builds again: $(basename out/*.zip .zip) in [this run]($RUN_URL)."
          done

      # The site keeps this app's upstream release meanwhile. The marker stops retries for a day, or until
      # the release or the patches change.
      # An earlier failure still on record (retries come a day apart) means it has failed for over a day:
      # open an issue for it, once. Publishing a build of the app closes it.
      - name: Record the failure
        if: steps.build.outcome == 'failure' && steps.rebuild.outcome != 'success'
        env:
          ID: ${{ steps.build.outputs.id }}
          REPAIR: ${{ steps.repair.outcome }}
        run: |
          if [ "${{ github.event_name }}" != push ]; then
            earlier=$(gh release view builds --json assets -q "[.assets[] | select(.name | startswith(\"$SLUG-\") and endswith(\".failed\")) | select(now - (.createdAt | fromdate) > 82800)] | length")
            echo "Build failed; see the Build apps run log." > "$ID.failed"
            gh release upload builds "$ID.failed" --clobber
            open=$(gh issue list --label build-failure --state open --json title -q "[.[] | select(.title == \"Build failing: $SLUG\")] | length")
            if [ "$earlier" -gt 0 ] && [ "$open" -eq 0 ]; then
              gh label create build-failure --color D93F0B --description "An app has failed to build for over a day" 2>/dev/null || true
              case "$REPAIR" in
                success) repair="Claude tried to repair its patches, but the app still didn't build with them." ;;
                failure) repair="Claude's patch repair failed to run (see the run log)." ;;
                *) repair="Claude's patch repair didn't run (no CLAUDE_CODE_OAUTH_TOKEN secret)." ;;
              esac
              gh issue create --label build-failure --title "Build failing: $SLUG" --body "$(printf '%s\n' \
                "The **$SLUG** build has failed for over a day. Meanwhile the site serves the app's upstream release (or, for an app built from a branch, its last good build), so it keeps working." \
                "" \
                "- Failing build: \`$ID\`" \
                "- Latest attempt: [run]($RUN_URL)" \
                "- $repair" \
                "" \
                "Patch problems are repaired automatically, so the likely causes are upstream code that doesn't build at this version, which the next upstream release may fix, or a build recipe that needs updating (\`scripts/build.mjs\`, \`.github/workflows/build.yml\`)." \
                "" \
                "The build is retried daily and as soon as a new version or patch lands. This issue closes itself when the app builds again.")"
            fi
          fi
          exit 1

  # Install whatever got built now, rather than at fetch.yml's next scheduled run. A push-triggered run
  # with failures also starts a run where Claude can repair them.
  deploy:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh workflow run fetch.yml -R ${{ github.repository }}
      - if: needs.build.result == 'failure' && github.event_name == 'push'
        run: gh workflow run build.yml -R ${{ github.repository }}
