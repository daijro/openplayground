name: Fetch releases

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: fetch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci

      # public/ holds the downloaded builds; restoring the last one lets `make fetch` skip unchanged releases.
      - id: restore
        uses: actions/cache/restore@v6
        with:
          path: public
          key: tools-${{ github.run_id }}
          restore-keys: tools-
      - run: make fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.restore.outputs.cache-matched-key != format('tools-{0}', hashFiles('public/*/.release'))
        uses: actions/cache/save@v6
        with:
          path: public
          key: tools-${{ hashFiles('public/*/.release') }}

      - run: make build

      # Cloudflare rebuilds and redeploys the site on every push to main, so committing a changed
      # versions.json is what ships a new release. (Pushes made with the workflow's token don't re-run it.)
      - name: Commit version changes
        run: |
          git diff --quiet versions.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          changes=$(git diff -U0 versions.json | sed -nE 's/^\+ +"([^"]+)": "([^"]+)".*/\1 \2/p' | paste -sd, - | sed 's/,/, /g')
          git commit -q -m "Update $changes" versions.json
          git pull -q --rebase && git push -q
