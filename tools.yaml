# Dashboard groups, each with its tools. Each tool is served at its hyphenated name; slug stays its build ID
# and redirects to that name. Listed in this order. A group's
# `alternative:` is its heading under the dashboard's "Alternative naming".
#
#   repo:   GitHub repo to download the web build from
#   license: the app's licence (SPDX id, from its LICENSE file), which its patches here are under too (patches/README.md).
#   copyright: its copyright line(s), as its LICENSE, NOTICE or README states them, for the bar's License notice
#           The bar's Source menu links its LICENSE file, or LICENSE-MIT and LICENSE-APACHE for "MIT OR Apache-2.0".
#   license_file: its one licence's file, where that isn't LICENSE (optional; ProCraft's is LICENSE-MIT)
#   tag:    release tag to pin (optional; default: the newest non-prerelease that has a matching asset, else
#           the newest pre-release that has one, for repos that have only pre-releases so far)
#   branch: the branch the head channel builds (optional; default: main)
#   paths:  only commits changing these paths count as new head versions (optional; default: any)
#   commit: pins the head channel to this commit (optional; for an upstream whose newer commits dropped its web version)
#   beside: sibling repos its build expects next to its checkout, {folder: owner/repo} (optional): cloned at their
#           newest commits, and the tool is then checked out under its repo's name, which they may point back at
#   asset:  regex matching the release asset name (optional; default: "-web-.*\.zip$")
#   alternative: the commercial app it's an open-source alternative to, shown as "Alternative to …" and
#           under the dashboard's "Alternative naming". Its icon there is icons/alternatives/<slug>.png: the product's
#           logo, greyscaled and chromatically glitched, rendered flat; the dashboard adds live grain and a glitch.
#   icon:   dashboard icon: the project's own, also copied in as the tool page's favicon
#   accent, base: a light and a dark brand color, used for the dashboard hover
#   theme:  script that makes the app follow the browser's light/dark preference (optional; see themes/)
#   patches: source patches for the app's own build (optional; see scripts/build.mjs). Every app is built
#           from source with a speed-first wasm-opt -O3; when its build is missing or failed, the site
#           serves the upstream release (with the theme script) instead.
#   build: false uses upstream releases only (already optimized by the app's own CI)
#   isolated: true sends the cross-origin isolation headers required by shared-memory WASM
#   live_kit: true copies the playground-live crate (patches/live/kit: the live-editing session and the presence look
#           every app shares) to <checkout>/playground-live for the tool's live.diff to depend on: the diff then only
#           adds the app's hooks (optional; Honeydew and Paint.RS have their own live editing in their source)
#   opens:  file types (extensions) the app is the natural home for: Files shows its icon on them and opens them
#           in it by default (no browser-side Open yet: [])
#   imports: other types its browser build takes in (imports, places, inserts): offered in Files' right-click menu
#
# Run `make fetch` after editing.

groups:
  - name: Image
    tools:
      - slug: photoshop
        name: PhotoCraft
        alternative: Photoshop
        blurb: Layers, masks, adjustments, brushes and real PSD files.
        opens: [psd, psb, psdt, pcraft, png, jpg, jpeg, webp, gif, bmp, tif, tiff, tga, ico, qoi, exr, hdr, heic, heif, afphoto]
        imports: [dng, cr2, cr3, nef, nrw, arw, pef, orf, rw2, raf, svg, svgz, pbm, pgm, ppm, pam, pfm, abr, grd, aco, ase, afdesign, afpub]
        repo: storytold/photocraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 ArtCraft Team and the PhotoCraft contributors"
        icon: icons/photocraft.png
        theme: themes/photoshop.js
        patches: patches/photoshop.yaml
        live_kit: true
        accent: "#31A8FF"
        base: "#001E36"

      - slug: illustrator
        name: VectorCraft
        alternative: Illustrator
        blurb: Vector paths, type and artboards.
        opens: [vectorcraft, drawcraft, ai, ait, eps, svg, svgz, emf, wmf, afdesign]
        imports: [pdf, png, jpg, jpeg, gif, webp, tif, tiff, bmp, dxf, txt, gpl, ase]
        repo: storytold/vectorcraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 ArtCraft Team and the VectorCraft contributors"
        icon: icons/vectorcraft.png
        theme: themes/illustrator.js
        patches: patches/illustrator.yaml
        live_kit: true
        accent: "#FF9A00"
        base: "#330000"

      - slug: coreldraw
        name: TraceDraw
        alternative: CorelDRAW
        blurb: Vector illustration with a classic desktop workflow, opening and saving .cdr files.
        # Upstream's browser build is published on its GitHub Pages only (its releases are desktop packages, no web
        # zip), so like Pro Wave it has the head channel only; patches/coreldraw.yaml builds it with its font folder
        # and Help, and connects it to Files. Opens: its drawings and CorelDRAW's; the rest open or import as File >
        # Open and File > Import do (pictures go into the drawing shown).
        opens: [cdr, cdt, cdrt, cmx, tdraw]
        imports: [svg, svgz, pdf, ai, eps, ps, prn, dxf, emf, wmf, plt, hpgl, hgl, psd, psb, txt, rtf, docx, png, jpg, jpeg, bmp, gif, webp, tif, tiff]
        repo: igtoth/tracedraw
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 Ighor Toth and the TraceDraw contributors"
        patches: patches/coreldraw.yaml
        icon: icons/tracedraw.png
        accent: "#5AC8FF"
        base: "#1C2028"

      - slug: indesign
        name: DesignCraft
        alternative: InDesign
        blurb: Page layout and publishing.
        opens: [designcraft, idml]
        imports: [png, jpg, jpeg, gif, webp, tif, tiff, bmp, psd, svg, pdf, ai, txt, docx, rtf, md, xlsx, ase]
        repo: storytold/designcraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 ArtCraft Team and the DesignCraft contributors"
        icon: icons/designcraft.png
        theme: themes/indesign.js
        patches: patches/indesign.yaml
        live_kit: true
        accent: "#FF3366"
        base: "#49021F"

      - slug: lightroom
        name: LightCraft
        alternative: Lightroom
        blurb: Photo library and raw development.
        opens: [dng, cr2, cr3, nef, nrw, arw, pef, orf, rw2, raf, rwl, raw, iiq, crw, mrw, x3f, kdc, mos, erf]
        imports: [jpg, jpeg, png, tif, tiff, webp, psd, jxl, gif, bmp, heic, avif]
        repo: storytold/lightcraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 ArtCraft Team and the LightCraft contributors"
        icon: icons/lightcraft.png
        patches: patches/lightroom.yaml
        live_kit: true
        accent: "#31A8FF"
        base: "#001E36"

      - slug: lightroom-classic
        name: LightCraft Classic
        alternative: Lightroom Classic
        blurb: Catalog, Develop, Map, Book, Slideshow, Print and Web modules.
        opens: [dng, cr2, cr3, nef, nrw, arw, pef, orf, rw2, raf, rwl, raw, iiq, crw, mrw, x3f, kdc, mos, erf]
        imports: [jpg, jpeg, png, tif, tiff, webp, psd, jxl, gif, bmp, heic, avif]
        repo: emmertex/lightcraft-classic
        license: MIT
        copyright: ["Copyright (c) the LightCraft contributors", "Copyright (c) the PhotoCraft contributors", "Copyright (c) the project contributors"]
        icon: icons/lightcraft-classic.svg
        patches: patches/lightroom-classic.yaml
        live_kit: true
        accent: "#31A8FF"
        base: "#001E36"

      - slug: figma
        name: FigCraft
        alternative: Figma
        blurb: Interface design, components and prototypes.
        # The web build has no file dialogs; dropped files only import after creating a design.
        opens: []
        imports: []
        repo: storytold/figcraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 ArtCraft Team and the FigCraft contributors"
        icon: icons/figcraft.png
        theme: themes/figma.js
        patches: patches/figma.yaml
        live_kit: true
        accent: "#02DA96"
        base: "#062E22"

      - slug: fireworks
        name: FireCraft
        alternative: Fireworks
        blurb: Vector and bitmap screen graphics, symbols, slices and real Fireworks PNGs.
        # Its own Open dialog and downloads: nothing in it talks to Files yet (its host-page bridge,
        # docs/WEBOS.md upstream, could).
        opens: []
        imports: []
        repo: aliasfoxkde/FireCraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 FireCraft contributors"
        # Built here from its releases and head commit (patches/fireworks.yaml: its web/ bundle, with relative paths).
        # What the web build compiles: docs, corpus and CI commits don't rebuild it.
        paths: [crates, web, assets, Cargo.toml, Cargo.lock]
        patches: patches/fireworks.yaml
        icon: icons/firecraft.svg
        accent: "#E3D21E"
        base: "#2B2700"

      - slug: mspaint
        name: PaintCraft
        alternative: Microsoft Paint
        blurb: Pencil, brushes, fills, shapes, text, selections and layers, in the classic Paint look.
        # Its own projects (.pcnd, with layers) and pictures. Upstream's releases are desktop packages only (no web
        # zip), so like Pro Wave it has the head channel only; patches/mspaint.yaml builds its browser editor
        # (apps/paintcraft-web, Classic presentation) the way Playground serves apps.
        opens: [pcnd, png, bmp, jpg, jpeg]
        imports: []
        repo: replicraft/PaintCraft
        license: MIT
        copyright: "Copyright (c) 2026 replicraft"
        # What the web build compiles (Cargo.lock: dependency changes; assets: its fonts and icons): docs, CI, the
        # desktop app and packaging commits don't rebuild it. One GitHub API request per path per check.
        paths: [crates, apps/paintcraft-web, assets, Cargo.toml, Cargo.lock, rust-toolchain.toml]
        patches: patches/mspaint.yaml
        live_kit: true
        icon: icons/paintcraft.png
        accent: "#1E90F5"
        base: "#0B2245"

      - slug: paint-net
        name: Paint.RS
        alternative: Paint.NET
        blurb: Layers, adjustments, effects and plugins.
        opens: []
        imports: []
        repo: daijro/paint.rs
        license: GPL-3.0-or-later
        copyright: "Copyright (C) 2026-present paint.rs contributors"
        # Its release's web zip is built with wasm-opt -O3 and SIMD already, and carries the licence notices a
        # plain trunk build leaves out, so Playground serves it as it is. Its live editing is in its own source
        # (crates/paintrs/src/live.rs), as Honeydew's is.
        build: false
        icon: icons/paint-rs.png
        accent: "#F74C00"
        base: "#3A1200"

      - slug: procreate
        name: ProCraft
        alternative: Procreate
        blurb: Layered painting with pressure brushes, masks, selections, text and animation.
        # Its paintings (.procraft) and the images and PSDs it opens; brushes (Procreate's .brush and .brushset,
        # Photoshop's, Krita's, Clip Studio's, GIMP's), palettes and fonts import. Upstream's releases are Android, iOS
        # and Windows packages only (no web zip), so like Pro Wave it has the head channel only; patches/procreate.yaml
        # adds the web build.
        opens: [procraft, png, jpg, jpeg, webp, bmp, gif, tif, tiff, psd]
        imports: [brush, brushset, abr, kpp, bundle, sut, gbr, pcbrush, pcpalette, gpl, ttf, otf]
        repo: surfrpt1/procraft
        license: MIT
        license_file: LICENSE-MIT
        copyright: "Copyright (c) 2026 surfrpt1"
        # What the web build compiles (Cargo.lock: dependency changes; assets: its font and icons): docs, CI and the
        # mobile file-dialog shim's commits don't rebuild it. One GitHub API request per path per check.
        paths: [apps/procraft, crates/engine, assets, Cargo.toml, Cargo.lock]
        patches: patches/procreate.yaml
        icon: icons/procraft.svg
        accent: "#C9A227"
        base: "#0B3D3A"

  - name: Office
    tools:
      - slug: word
        name: WordCraft
        alternative: Word
        blurb: Writing and document design.
        opens: [docx, docm, dotx, dotm, odt, rtf, txt, md, html, htm]
        imports: [png, jpg, jpeg, gif, webp, bmp]
        repo: storytold/wordcraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 ArtCraft Team and the WordCraft contributors"
        icon: icons/wordcraft.svg
        theme: themes/word.js
        patches: patches/word.yaml
        live_kit: true
        accent: "#41A5EE"
        base: "#0B2557"

      - slug: excel
        name: GridCraft
        alternative: Excel
        blurb: Spreadsheets and data.
        opens: [xlsx, xlsm, xltx, xltm, csv, tsv]
        imports: [txt, json, tab]
        repo: storytold/gridcraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 ArtCraft Team and the GridCraft contributors"
        icon: icons/gridcraft.svg
        theme: themes/excel.js
        patches: patches/excel.yaml
        live_kit: true
        accent: "#33C481"
        base: "#062E19"

      - slug: powerpoint
        name: DeckCraft
        alternative: PowerPoint
        blurb: Presentations and slide shows.
        opens: [pptx, potx, ppsx, deckcraft]
        imports: [png, jpg, jpeg, gif, webp, bmp, tif, tiff, wav, mp3, m4a, aac, flac, ogg, opus, aif, aiff, mp4, m4v, mov, webm, txt, md]
        repo: storytold/deckcraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 ArtCraft Team and the DeckCraft contributors"
        icon: icons/deckcraft.png
        theme: themes/powerpoint.js
        patches: patches/powerpoint.yaml
        live_kit: true
        accent: "#FF8F6B"
        base: "#3D1308"

      - slug: onenote
        name: NoteCraft
        alternative: OneNote
        blurb: Notebooks, sections and pages for notes, kept as plain folders of HTML and Markdown pages.
        # A page is an index.html or index.md in its own folder; the web build keeps the notebooks in Files at
        # browser:/NoteCraft. Upstream has no releases yet, so like MaterialCraft it has the head channel only;
        # patches/onenote.yaml adds the web build.
        opens: [html, md]
        imports: []
        repo: AlienTechSoftware/notecraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 AlienTech Software and the NoteCraft contributors"
        # What the web build compiles (Cargo.lock: dependency changes; the engine embeds docs/demo/DemoNotebook):
        # README, other docs and CI commits don't rebuild it.
        paths: [crates, assets, docs/demo/DemoNotebook, Cargo.toml, Cargo.lock, rust-toolchain.toml]
        patches: patches/onenote.yaml
        live_kit: true
        icon: icons/notecraft.png
        accent: "#CA64EA"
        base: "#2B0B40"

      - slug: outlook
        name: MailCraft
        alternative: Outlook
        blurb: Mail, calendar, people and tasks.
        # Its browser build can't reach mail servers: mail comes in through its own File › Import (.eml, .ics,
        # .vcf), the mailbox lives in the browser's storage, and saving downloads. It follows the system theme itself.
        opens: []
        imports: []
        repo: UCS-Care-Group/mailcraft
        license: MIT OR Apache-2.0
        # NOTICE: parts started from WordCraft's source, under its copyright.
        copyright: ["Copyright (c) 2026 the MailCraft contributors", "Copyright (c) 2026 ArtCraft Team and the WordCraft contributors"]
        icon: icons/mailcraft.png
        accent: "#28A8EA"
        base: "#0A2767"

      - slug: acrobat
        name: PdfCraft
        alternative: Acrobat Pro
        blurb: Read, organize, combine, split and secure PDFs.
        opens: [pdf]
        imports: [png, jpg, jpeg, tif, tiff, gif, bmp, jp2, j2k, jpx, txt]
        repo: storytold/pdfcraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 ArtCraft Team and the PdfCraft contributors"
        patches: patches/acrobat.yaml
        live_kit: true
        icon: icons/pdfcraft.png
        theme: themes/acrobat.js
        accent: "#FA0F00"
        base: "#3A0400"

      - slug: matlab
        name: MatCraft
        alternative: MATLAB
        blurb: Matrices, .m scripts, a command window and 2D and 3D plots.
        # Its browser build keeps no files (upstream: on wasm32 there is no file system): scripts are typed in
        # its editor and command window. Upstream has no releases yet, so it has the head channel only.
        opens: []
        imports: []
        repo: NibrasAz7/matcraft
        branch: master
        license: MIT OR Apache-2.0
        # NOTICE names the MatCraft contributors; LICENSE-MIT still carries GridCraft's line, from the ArtCraft
        # template MatCraft started from.
        copyright: ["Copyright 2026 The MatCraft contributors", "Copyright (c) 2026 ArtCraft Team and the GridCraft contributors"]
        # What the web build compiles: README, docs and examples don't rebuild it.
        paths: [crates, apps, assets, Cargo.toml, Cargo.lock]
        # Its Cargo.toml paths point at ../craft-libs and ../simcraft (which points back at ../matcraft). A change in
        # those alone doesn't rebuild it.
        beside: {craft-libs: NibrasAz7/craft-libs, simcraft: NibrasAz7/simcraft}
        patches: patches/matlab.yaml
        icon: icons/matcraft.png
        accent: "#E16737"
        base: "#3B1508"

  - name: Video
    tools:
      - slug: premiere
        name: FilmCraft
        alternative: Premiere Pro
        blurb: Video editing, color and sound.
        opens: [fcproj, mp4, m4v, mov, mkv, webm, avi, mxf, mts, m2ts, mpg, mpeg, 3gp]
        imports: [wav, aif, aiff, mp3, m4a, aac, flac, ogg, opus, png, jpg, jpeg, gif, webp, tif, tiff, bmp, srt, vtt, scc, edl, fcpxml, otio, aaf, omf]
        repo: storytold/filmcraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 ArtCraft Team and the FilmCraft contributors"
        icon: icons/filmcraft.png
        theme: themes/premiere.js
        patches: patches/premiere.yaml
        live_kit: true
        accent: "#9999FF"
        base: "#00005B"

      - slug: after-effects
        name: EffectCraft
        alternative: After Effects
        blurb: Compositions, keyframes, effects and expressions.
        opens: [ecproj]
        imports: [mp4, mov, m4v, mkv, webm, png, jpg, jpeg, gif, webp, tif, tiff, bmp, exr, wav, aif, aiff, mp3, flac, ogg, opus, svg, pdf, ai, eps, psd, psb, gltf, glb, obj, csv, tsv]
        repo: storytold/effectcraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 ArtCraft Team and the EffectCraft contributors"
        icon: icons/effectcraft.png
        theme: themes/after-effects.js
        patches: patches/after-effects.yaml
        live_kit: true
        accent: "#9999FF"
        base: "#00005B"

      - slug: davinci-resolve
        name: Picasso Suite
        alternative: DaVinci Resolve
        blurb: Cut and edit video on a multi-track timeline, with linked picture and sound.
        # Its own projects (.pcsp) and Resolve's (.drp, whose media stay where Resolve kept them). Upstream's releases
        # are desktop packages only (no web zip), so like Pro Wave it has the head channel only;
        # patches/davinci-resolve.yaml adds the web build, which reads media with the browser instead of FFmpeg.
        opens: [pcsp]
        imports: [mp4, m4v, mov, webm, mkv, png, jpg, jpeg, gif, webp, bmp, wav, mp3, m4a, aac, flac, ogg, opus]
        repo: fabox-os/Picasso-Suite
        license: GPL-3.0-or-later
        # Upstream states no copyright line (its LICENSE is the GPL text, its README none): its owner and contributors.
        copyright: "Copyright (c) fabox-os and the Picasso Suite contributors"
        # What the web build compiles (Cargo.lock: dependency changes): docs and packaging commits don't rebuild it.
        paths: [crates, Cargo.toml, Cargo.lock]
        patches: patches/davinci-resolve.yaml
        live_kit: true
        icon: icons/picasso-suite.png
        accent: "#E8452C"
        base: "#3A1208"

      - slug: pluraleyes
        name: Align
        alternative: PluralEyes
        blurb: Sync camera footage and separately recorded audio by sound and timecode, then export for your editor.
        # Upstream's desktop app is built with GPUI, which has no browser backend, and its releases are desktop packages
        # only: patches/pluraleyes.yaml builds its engine for the web with a page of its own (head channel only). Audio
        # and video go in (MOV, MP4 and audio files; MTS, MXF and R3D need FFmpeg, which a page doesn't have).
        opens: []
        imports: [mov, mp4, m4v, wav, wave, bwf, aif, aiff, aifc, mp3, m4a, aac, flac]
        repo: FedyaLight/align
        license: GPL-3.0-only
        copyright: "Copyright (c) 2026 Align contributors"
        # What the web build compiles: the engine's crates (Cargo.lock: dependency changes). The desktop app, CLI, MCP
        # server, docs and packaging don't rebuild it. One GitHub API request per path per check.
        paths: [crates/align-core, crates/align-decode, Cargo.lock]
        patches: patches/pluraleyes.yaml
        icon: icons/align.png
        accent: "#7C6CF7"
        base: "#1E1A47"

  - name: 3D
    tools:
      - slug: autocad
        name: CADCraft
        alternative: AutoCAD
        blurb: Computer-aided design and drafting.
        opens: []
        imports: []
        repo: storytold/cadcraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 ArtCraft Team and the CADCraft contributors"
        patches: patches/autocad.yaml
        live_kit: true
        icon: icons/cadcraft.png
        accent: "#E85984"
        base: "#3A0716"

      - slug: fusion-360
        name: SolidCraft
        alternative: Fusion 360
        blurb: Parametric 3D modeling with sketches, constraints and solids.
        # Designs, and STEP/IGES/STL/3MF/OBJ (each opens as a new design, or joins one that has features).
        opens: [solidcraft, solvecraft, step, stp, iges, igs, stl, 3mf, obj]
        imports: []
        repo: bherbruck/solvecraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) 2026 SolidCraft contributors"
        # Its web zip is solidcraft-web-<version>.zip (the default pattern; the old solvecraft-<tag>-web.zip naming
        # stopped at v0.1.1); nightlies are pre-releases.
        # The web app and what it compiles (dependency changes show up in Cargo.lock; the root Cargo.toml holds
        # the release profile and the vendored truck patches): CI, docs and desktop-only commits don't rebuild it.
        paths: [apps/solidcraft-web, crates, vendor, Cargo.lock, Cargo.toml]
        icon: icons/solidcraft.svg
        theme: themes/fusion-360.js
        patches: patches/fusion-360.yaml
        live_kit: true
        accent: "#FF7A1F"
        base: "#3A1806"

      - slug: substance-painter
        name: SubCraft
        alternative: Substance Painter
        blurb: Paint 3D models with layered materials, masks and textures.
        opens: []
        imports: []
        repo: Aalzard/subcraft
        license: MIT OR Apache-2.0
        copyright: "Copyright (c) Aalzard and the SubCraft contributors"
        # Pinned: upstream removed its browser version right after this commit (4c3aacf, "Remove the browser version …
        # (ADR-0038)"), so newer commits have no web build. patches/substance-painter.yaml fits this commit.
        commit: 71e49fde7e4e1dba188a6589c9e5a139d1e3d9d5
        patches: patches/substance-painter.yaml
        live_kit: true
        icon: icons/subcraft.png
        accent: "#FF7A1A"
        base: "#3A1A06"

