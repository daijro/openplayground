# Dashboard groups, each with its tools. Each tool is served at its hyphenated name; slug stays its build ID
# and redirects to that name. Listed in this order. A group's
# `alternative:` is its heading under the dashboard's "Alternative naming".
#
#   repo:   GitHub repo to download the web build from
#   license: the app's licence (SPDX id, from its LICENSE file), which its patches here are under too (patches/README.md).
#           The bar's Source menu links its LICENSE file, or LICENSE-MIT and LICENSE-APACHE for "MIT OR Apache-2.0".
#   tag:    release tag to pin (optional; default: the newest non-prerelease that has a matching asset, else
#           the newest pre-release that has one, for repos that have only pre-releases so far)
#   branch: the branch the head channel builds (optional; default: main)
#   paths:  only commits changing these paths count as new head versions (optional; default: any)
#   commit: pins the head channel to this commit (optional; for an upstream whose newer commits dropped its web version)
#   asset:  regex matching the release asset name (optional; default: "-web-.*\.zip$")
#   alternative: the commercial app it's an open-source alternative to, shown as "Alternative to …" and
#           under the dashboard's "Alternative naming". Its icon there is icons/alternatives/<slug>.png: the product's
#           logo, greyscaled and chromatically glitched, rendered flat; the dashboard adds live grain and a glitch.
#   icon:   dashboard icon: the project's own, also copied in as the tool page's favicon
#   accent, base: a light and a dark brand color, used for the dashboard hover
#   theme:  script that makes the app follow the browser's light/dark preference (optional; see themes/)
#   patches: source patches for the app's own build (optional; see scripts/build.mjs). Every app is built
#           from source with a speed-first wasm-opt -O3; when its build is missing or failed, the site
#           serves the upstream release (with the theme script) instead.
#   build: false uses upstream releases only (already optimized by the app's own CI)
#   isolated: true sends the cross-origin isolation headers required by shared-memory WASM
#   live_kit: true copies the playground-live crate (patches/live/kit: the live-editing session and the presence look
#           every app shares) to <checkout>/playground-live for the tool's live.diff to depend on: the diff then only
#           adds the app's hooks (optional; Honeydew and Paint.RS have their own live editing in their source)
#   opens:  file types (extensions) the app is the natural home for: Files shows its icon on them and opens them
#           in it by default (no browser-side Open yet: [])
#   imports: other types its browser build takes in (imports, places, inserts): offered in Files' right-click menu
#
# Run `make fetch` after editing.

groups:
  - name: Creative
    alternative: Adobe Creative Cloud
    tools:
      - slug: photoshop
        name: PhotoCraft
        alternative: Photoshop
        blurb: Layers, masks, adjustments, brushes and real PSD files.
        opens: [psd, psb, psdt, pcraft, png, jpg, jpeg, webp, gif, bmp, tif, tiff, tga, ico, qoi, exr, hdr, heic, heif, afphoto]
        imports: [dng, cr2, cr3, nef, nrw, arw, pef, orf, rw2, raf, svg, svgz, pbm, pgm, ppm, pam, pfm, abr, grd, aco, ase, afdesign, afpub]
        repo: storytold/photocraft
        license: MIT OR Apache-2.0
        icon: icons/photocraft.png
        theme: themes/photoshop.js
        patches: patches/photoshop.yaml
        live_kit: true
        accent: "#31A8FF"
        base: "#001E36"

      - slug: illustrator
        name: VectorCraft
        alternative: Illustrator
        blurb: Vector paths, type and artboards.
        opens: [vectorcraft, drawcraft, ai, ait, eps, svg, svgz, emf, wmf, afdesign]
