# Dashboard groups, each with its tools. Each tool is served at /<slug>/ and listed in this order.
#
#   repo:   GitHub repo to download the web build from
#   tag:    release tag to pin (optional; default: the newest non-prerelease that has a matching asset)
#   asset:  regex matching the release asset name (optional; default: "-web-.*\.zip$")
#   icon:   dashboard icon, also copied in as the tool page's favicon
#   accent, base: a light and a dark brand color, used for the dashboard hover
#   theme:  script that makes the app follow the browser's light/dark preference (optional; see themes/)
#
# Run `make fetch` after editing.

groups:
  - name: Adobe Creative Cloud
    tools:
      - slug: photoshop
        name: Photoshop
        blurb: Layers, masks, adjustments, brushes and real PSD files.
        repo: storytold/photocraft
        icon: icons/photoshop.svg
        theme: themes/photoshop.js
        accent: "#31A8FF"
        base: "#001E36"

      - slug: illustrator
        name: Illustrator
        blurb: Vector paths, type and artboards.
        repo: storytold/vectorcraft
        icon: icons/illustrator.svg
        theme: themes/illustrator.js
        accent: "#FF9A00"
        base: "#330000"

      - slug: indesign
        name: InDesign
        blurb: Page layout and publishing.
        repo: storytold/designcraft
        icon: icons/indesign.svg
        theme: themes/indesign.js
        accent: "#FF3366"
        base: "#49021F"

      - slug: lightroom
        name: Lightroom
        blurb: Photo library and raw development.
        repo: storytold/lightcraft
        icon: icons/lightroom.svg
        accent: "#31A8FF"
        base: "#001E36"

      - slug: premiere
        name: Premiere Pro
        blurb: Video editing, color and sound.
        repo: storytold/filmcraft
        icon: icons/premiere.svg
        theme: themes/premiere.js
        accent: "#9999FF"
        base: "#00005B"

      - slug: after-effects
        name: After Effects
        blurb: Compositions, keyframes, effects and expressions.
        repo: storytold/effectcraft
        icon: icons/after-effects.svg
        theme: themes/after-effects.js
        accent: "#9999FF"
        base: "#00005B"

      - slug: acrobat
        name: Acrobat Pro
        blurb: Read, organize, combine, split and secure PDFs.
        repo: storytold/pdfcraft
        icon: icons/acrobat.svg
        theme: themes/acrobat.js
        accent: "#FA0F00"
        base: "#3A0400"

  - name: Microsoft Office
    tools:
      - slug: word
        name: Word
        blurb: Writing and document design.
        repo: storytold/wordcraft
        icon: icons/word.svg
        theme: themes/word.js
        accent: "#41A5EE"
        base: "#0B2557"

      - slug: excel
        name: Excel
        blurb: Spreadsheets and data.
        repo: storytold/gridcraft
        icon: icons/excel.svg
        theme: themes/excel.js
        accent: "#33C481"
        base: "#062E19"

      - slug: powerpoint
        name: PowerPoint
        blurb: Presentations and slide shows.
        repo: storytold/deckcraft
        icon: icons/powerpoint.svg
        theme: themes/powerpoint.js
        accent: "#FF8F6B"
        base: "#3D1308"
